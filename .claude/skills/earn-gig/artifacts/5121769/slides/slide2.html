<!DOCTYPE html><html><head><style>
html{background:#ffffff;}
body{width:720pt;height:405pt;margin:0;padding:0;display:flex;flex-direction:column;font-family:'Yu Gothic','Hiragino Sans',Meiryo,sans-serif;background:#ffffff;}
.head{height:54pt;background:#1B4965;display:flex;align-items:center;}
.head h2{margin:0 0 0 30pt;color:#ffffff;font-size:23pt;font-weight:bold;}
.head .tab{margin-left:auto;width:14pt;height:54pt;background:#E8732B;}
.body{flex:1;display:flex;margin:18pt 30pt 16pt 30pt;}
.left{width:300pt;margin-right:24pt;}
.seclabel{border-left:6pt solid #E8732B;padding-left:10pt;margin:0 0 5pt 0;}
.seclabel p{margin:0;color:#1B4965;font-size:15pt;font-weight:bold;}
ul{margin:0 0 11pt 0;padding-left:20pt;color:#23303A;font-size:12.5pt;line-height:1.45;}
.right{flex:1;display:flex;flex-direction:column;}
.caption{margin:0 0 5pt 0;color:#3E5C6E;font-size:12.5pt;font-weight:bold;}
.chart{width:100%;height:188pt;background:#F2F6F9;border:1px solid #CFE0EA;border-radius:8pt;}
.q{margin-top:12pt;background:#E8732B;border-radius:8pt;padding:11pt 16pt;}
.q p{margin:0;color:#ffffff;font-size:13.5pt;font-weight:bold;text-align:center;}
</style></head><body>
<div class="head"><h2>本日のポイント</h2><div class="tab"></div></div>
<div class="body">
  <div class="left">
    <div class="seclabel"><p>学習のねらい</p></div>
    <ul>
      <li>比例・反比例の式を立てて、表とグラフを読みとる</li>
      <li>日常事例（買い物／速さ）から関係を見つける</li>
      <li>x が増えたとき y がどう変わるかを説明できる</li>
    </ul>
    <div class="seclabel"><p>キーワード</p></div>
    <ul>
      <li>比例定数・反比例・グラフ・表</li>
    </ul>
    <div class="seclabel"><p>授業の流れ</p></div>
    <ul>
      <li>導入：身近な事例で「変わり方」を観察</li>
      <li>展開：式 → 表 → グラフ を行き来</li>
      <li>演習：3 問 → ペアで確認</li>
    </ul>
  </div>
  <div class="right">
    <p class="caption">グラフ：y = 80x（あめ 1 個 80 円）</p>
    <div id="chart" class="chart placeholder"></div>
    <div class="q"><p>確認問題：x が 2 倍になると y はどうなる？</p></div>
  </div>
</div>
</body></html>
