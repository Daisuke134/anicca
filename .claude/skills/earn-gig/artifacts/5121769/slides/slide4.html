<!DOCTYPE html><html><head><style>
html{background:#ffffff;}
body{width:720pt;height:405pt;margin:0;padding:0;display:flex;flex-direction:column;font-family:'Yu Gothic','Hiragino Sans',Meiryo,sans-serif;background:#ffffff;}
.head{height:56pt;background:#1B4965;display:flex;align-items:center;}
.head h2{margin:0 0 0 30pt;color:#ffffff;font-size:24pt;font-weight:bold;}
.head .tab{margin-left:auto;width:14pt;height:56pt;background:#E8732B;}
.body{flex:1;display:flex;margin:18pt 30pt 30pt 30pt;}
.left{width:340pt;margin-right:24pt;display:flex;flex-direction:column;justify-content:center;}
.seclabel{margin:0 0 12pt 0;border-left:6pt solid #E8732B;padding-left:10pt;}
.seclabel p{margin:0;color:#1B4965;font-size:17pt;font-weight:bold;}
.row{display:flex;align-items:center;margin:0 0 11pt 0;}
.num{width:26pt;height:26pt;background:#1B4965;border-radius:13pt;display:flex;align-items:center;justify-content:center;margin-right:12pt;}
.num p{margin:0;color:#ffffff;font-size:13pt;font-weight:bold;}
.row .t{flex:1;}
.row .t p{margin:0;color:#23303A;font-size:13.5pt;line-height:1.35;}
.right{flex:1;display:flex;flex-direction:column;}
.note{background:#F2F6F9;border:1px solid #CFE0EA;border-radius:10pt;padding:18pt 20pt;flex:1;display:flex;flex-direction:column;justify-content:center;}
.note .nh{margin:0 0 12pt 0;color:#1B4965;font-size:16pt;font-weight:bold;}
.note p{margin:0 0 10pt 0;color:#27343D;font-size:14pt;line-height:1.55;}
.cta{margin-top:14pt;background:#1B4965;border-radius:10pt;padding:14pt 16pt;}
.cta p{margin:0;color:#ffffff;font-size:14pt;font-weight:bold;text-align:center;}
</style></head><body>
<div class="head"><h2>まとめ と 振り返り</h2><div class="tab"></div></div>
<div class="body">
  <div class="left">
    <div class="seclabel"><p>今日のまとめ</p></div>
    <div class="row"><div class="num"><p>1</p></div><div class="t"><p>比例は y = a × x、反比例は y = a ÷ x</p></div></div>
    <div class="row"><div class="num"><p>2</p></div><div class="t"><p>表・式・グラフは同じ関係の3つの見方</p></div></div>
    <div class="row"><div class="num"><p>3</p></div><div class="t"><p>身近な事例に当てはめると関係が見える</p></div></div>
    <div class="row"><div class="num"><p>4</p></div><div class="t"><p>変わり方を一言で説明できれば理解できた証拠</p></div></div>
  </div>
  <div class="right">
    <div class="note">
      <p class="nh">ひとことで書こう</p>
      <p>「x が増えると y は ____ なる。<br>なぜなら ____ だから。」</p>
      <p>比例・反比例それぞれで 1 文ずつ書いてみよう。</p>
    </div>
    <div class="cta"><p>次回：グラフから式を読みとる</p></div>
  </div>
</div>
</body></html>
