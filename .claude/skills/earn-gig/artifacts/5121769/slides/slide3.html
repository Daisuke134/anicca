<!DOCTYPE html><html><head><style>
html{background:#ffffff;}
body{width:720pt;height:405pt;margin:0;padding:0;display:flex;flex-direction:column;font-family:'Yu Gothic','Hiragino Sans',Meiryo,sans-serif;background:#ffffff;}
.head{height:56pt;background:#1B4965;display:flex;align-items:center;}
.head h2{margin:0 0 0 30pt;color:#ffffff;font-size:24pt;font-weight:bold;}
.head .tab{margin-left:auto;width:14pt;height:56pt;background:#E8732B;}
.cards{flex:1;display:flex;margin:22pt 30pt;}
.card{flex:1;border:1px solid #D8DFE6;border-radius:10pt;display:flex;flex-direction:column;overflow:hidden;}
.card.left{margin-right:20pt;}
.chead{height:46pt;display:flex;align-items:center;justify-content:center;}
.chead.blue{background:#1B4965;}
.chead.orange{background:#E8732B;}
.chead p{margin:0;color:#ffffff;font-size:20pt;font-weight:bold;}
.cbody{flex:1;padding:16pt 18pt;background:#ffffff;display:flex;flex-direction:column;justify-content:center;}
.lbl{margin:0 0 3pt 0;font-size:13pt;font-weight:bold;}
.lbl.blue{color:#1B4965;}
.lbl.orange{color:#E8732B;}
.eq{margin:0 0 12pt 0;color:#1B2A33;font-size:16pt;font-weight:bold;}
.ex{margin:0;color:#27343D;font-size:13pt;line-height:1.5;}
</style></head><body>
<div class="head"><h2>比較 — 比例 と 反比例</h2><div class="tab"></div></div>
<div class="cards">
  <div class="card left">
    <div class="chead blue"><p>Ⅰ. 比例</p></div>
    <div class="cbody">
      <p class="lbl blue">式</p>
      <p class="eq">y = a × x　（a は比例定数）</p>
      <p class="lbl blue">例</p>
      <p class="ex">あめ 1 個 80 円 → y = 80x<br>x（個数）が増えると y（代金）も増える</p>
      <p class="lbl blue">グラフ</p>
      <p class="ex">原点を通る右上がりの直線</p>
    </div>
  </div>
  <div class="card">
    <div class="chead orange"><p>Ⅱ. 反比例</p></div>
    <div class="cbody">
      <p class="lbl orange">式</p>
      <p class="eq">y = a ÷ x　（a は一定）</p>
      <p class="lbl orange">例</p>
      <p class="ex">12km を時速 x で進む → y = 12 ÷ x<br>x（速さ）が増えると y（時間）は減る</p>
      <p class="lbl orange">グラフ</p>
      <p class="ex">なめらかな右下がりの曲線（双曲線）</p>
    </div>
  </div>
</div>
</body></html>
