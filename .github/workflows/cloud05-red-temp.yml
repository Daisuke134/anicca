name: TEMP CLOUD-05 verification

on:
  push:
    branches:
      - fix/cloud-05-settings-recovery-20260906

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/life-manager
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: CLOUD-05 settings and recovery contracts
        run: |
          node --test \
            lib/cloud-05-settings-recovery.test.js \
            lib/user-command.test.js \
            lib/panel-control-center.test.js \
            lib/panel-api.test.js \
            lib/telegram-onboard.test.js \
            test/tenant-isolation.test.js \
            test/wake-loop-isolation.test.js
      - name: Diff hygiene
        working-directory: .
        run: git diff --check HEAD~4..HEAD
