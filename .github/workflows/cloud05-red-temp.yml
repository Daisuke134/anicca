name: TEMP CLOUD-05 RED

on:
  push:
    branches:
      - fix/cloud-05-settings-recovery-20260906

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/life-manager
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: CLOUD-05 RED
        run: node --test lib/cloud-05-settings-recovery.test.js
