name: Manager | real-human intervention outcome benchmarks (CPU cloud)

on:
  pull_request:
    paths:
      - ".github/workflows/manager-real-intervention-outcome-evals.yml"
      - "products/manager/evals/**"
      - "products/manager/docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-human-outcomes:
    name: HeartSteps delivery-status descriptive audit + RCT Bench (no GPU, no causal overclaim)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Manager product
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Software contract tests (synthetic fixture inputs only)
        working-directory: products/manager/evals
        run: python -m unittest -v test_heartsteps_v1_real_mrt.py test_rct_bench_real_outcome_eval.py
      - name: HeartSteps V1 real participants, corrected delivery status and step outcomes
        working-directory: products/manager/evals
        run: |
          mkdir -p ../../../outputs/manager-real-outcomes
          python heartsteps_v1_real_mrt.py > ../../../outputs/manager-real-outcomes/heartsteps-v1-aggregate.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("../../../outputs/manager-real-outcomes/heartsteps-v1-aggregate.json").read_text())
          s=j["jawbone_30min"]
          print("HeartSteps original decision records (DESCRIPTIVE, NOT causal):",s["total_source_decisions"],"available:",s["eligible_decisions"])
          print("Jawbone 30-min corrected delivery-status descriptive contrast:",s["observed_difference_steps"])
          print("Participant bootstrap CI:",s["bootstrap_95ci_cluster_participant"])
          print("Missing by arm",s["missing_rate_no_suggestion"],s["missing_rate_suggestion"])
          print("NOT CAUSAL/NOT ITT; original trial has 6061 published analytic decision points; no user rows uploaded")
          PY
      - name: RCT Bench direct behavioral adherence, QALY, mood/wellbeing outcomes
        working-directory: products/manager/evals
        run: |
          python rct_bench_real_outcome_eval.py > ../../../outputs/manager-real-outcomes/rctbench-aggregate.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("../../../outputs/manager-real-outcomes/rctbench-aggregate.json").read_text())
          for trial in j["trials"]:
              for r in trial["comparisons"]:
                  print("RCT",trial["trial_id"],r["outcome"],"n",trial["n_source_rows"],
                        "arm1 - arm0",r["arm1_minus_arm0"],
                        "95% bootstrap",r["bootstrap_95ci_respondent_resample"])
          print("Exploratory real RCT arm differences ONLY; no Manager field efficacy or individual treatment effects")
          PY
      - name: Train and evaluate study-disjoint HBCP smoking cessation prediction baselines
        working-directory: products/manager/evals
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.24,<3" "pandas>=2,<4" "scikit-learn>=1.3,<1.9"
          python hbcp_smoking_outcome_baselines.py > ../../../outputs/manager-real-outcomes/hbcp-smokefree-aggregate.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("../../../outputs/manager-real-outcomes/hbcp-smokefree-aggregate.json").read_text())
          print("HBCP published RCT study-arms:",j["n_arms"],"independent trials:",j["n_studies"])
          for model,vals in j["results"].items():
              print("HBCP",model,"study-disjoint MAE percentage points:",vals["mae_percentage_points"])
          print("These are baseline RCT arm outcome forecasts, NOT the original authors' RuleNN or causal effects")
          PY
      - name: Save aggregate-only evidence receipts (no individual records)
        uses: actions/upload-artifact@v4
        with:
          name: manager-real-intervention-outcomes-aggregate
          path: outputs/manager-real-outcomes/*.json
          retention-days: 30
