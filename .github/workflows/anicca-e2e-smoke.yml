name: Anicca E2E smoke (Maestro, selected gate flows)

# Fast free check of selected gate flows on a GitHub macOS runner
# simulator: onboarding (gate 01) then only the flows listed. Writes
# smoke-result.json, never gate-result.json, so it cannot certify an
# App Store build (use anicca-e2e-gate.yml for that). Runs on PRs that
# touch the gate flows/runner, or manually. Free: public repo, local
# Maestro CLI, no Maestro Cloud. Real-iPhone route: see
# team/runbooks/IOS-REAL-DEVICE-E2E.md in anicca-ops.

on:
  workflow_dispatch:
    inputs:
      flows:
        description: Space-separated gate flow names to run after onboarding
        required: false
        default: "06-quote-deep-link 07-notifications-screen"
        type: string
  pull_request:
    paths:
      - "apps/mobile/anicca-ios/maestro/gate/**"
      - "apps/mobile/anicca-ios/scripts/run-e2e-gate.sh"
      - ".github/workflows/anicca-e2e-smoke.yml"

permissions:
  contents: read

concurrency:
  group: anicca-e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Maestro smoke (selected gate flows)
    # Secrets are unavailable to fork PRs; only run for same-repo PRs.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15-intel
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      E2E_FLOWS_ONLY: ${{ inputs.flows || '06-quote-deep-link 07-notifications-screen' }}
    defaults:
      run:
        working-directory: apps/mobile/anicca-ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the free Maestro CLI
        run: brew install mobile-dev-inc/tap/maestro
      - name: Inject private real SDK configuration
        env:
          ANICCA_PRODUCTION_XCCONFIG_B64: ${{ secrets.ANICCA_E2E_XCCONFIG_B64 }}
        run: |
          bash ci_scripts/ci_post_clone.sh
          cp Configs/Production.xcconfig Configs/Staging.xcconfig
      - name: Build, run selected flows, write smoke-result.json
        run: bash scripts/run-e2e-gate.sh "$RUNNER_TEMP/e2e-smoke-evidence"
      - name: Preserve smoke evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e-smoke-evidence/smoke-result.json
            ${{ runner.temp }}/e2e-smoke-evidence/gate-result.json
            ${{ runner.temp }}/e2e-smoke-evidence/logs
            ${{ runner.temp }}/e2e-smoke-evidence/junit
            ${{ runner.temp }}/e2e-smoke-evidence/maestro-tests
          if-no-files-found: warn
          retention-days: 30
