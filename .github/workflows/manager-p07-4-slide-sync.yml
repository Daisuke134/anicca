name: Manager P07-4 | synchronize CBT/ACT slides and verified PDF on free cloud

on:
  pull_request:
    paths:
      - ".github/workflows/manager-p07-4-slide-sync.yml"
      - "docs/research/manager/masterclass/2026-11-04-p04-causal/experiments/p07_4_append_research_slides.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-p07-4-slides:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require an approved source branch, never a fork
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "Daisuke134/life-manager"
          test "$SOURCE_REPOSITORY" = "$REPOSITORY"
          test "$SOURCE_BRANCH" = "feat/manager-restore-full-p00-p12-p07-4-20261105"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use reproducible PowerPoint writer
        run: |
          python -m pip install --disable-pip-version-check "python-pptx==1.0.2"
          python docs/research/manager/masterclass/2026-11-04-p04-causal/experiments/p07_4_append_research_slides.py
      - name: Render PDF using LibreOffice and check exact pages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             libreoffice-impress poppler-utils fonts-noto-cjk
          D=docs/research/manager/masterclass/2026-11-04-p04-causal/journal_club
          mkdir -p /tmp/manager-p074-pdf
          timeout 360s libreoffice -env:UserInstallation=file:///tmp/manager-p074-lo             --headless --convert-to pdf --outdir /tmp/manager-p074-pdf             "$D/AI_BEHAVIOR_JOURNAL_CLUB_JA.pptx"
          test -s /tmp/manager-p074-pdf/AI_BEHAVIOR_JOURNAL_CLUB_JA.pdf
          test "$(pdfinfo /tmp/manager-p074-pdf/AI_BEHAVIOR_JOURNAL_CLUB_JA.pdf | awk '/^Pages:/ {print $2}')" = 114
          cp /tmp/manager-p074-pdf/AI_BEHAVIOR_JOURNAL_CLUB_JA.pdf "$D/"
          sha256sum "$D/AI_BEHAVIOR_JOURNAL_CLUB_JA.pptx" "$D/AI_BEHAVIOR_JOURNAL_CLUB_JA.pdf"
          echo "P07-4 research presentation and PDF both contain 114 pages"
      - name: Commit only the three updated canonical presentation artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          D=docs/research/manager/masterclass/2026-11-04-p04-causal/journal_club
          git add "$D/AI_BEHAVIOR_JOURNAL_CLUB_JA.pptx" "$D/AI_BEHAVIOR_JOURNAL_CLUB_JA.pdf" "$D/SPEAKER_NOTES_JA.md"
          if ! git diff --cached --quiet; then
            git commit -m "slides(manager): add P07-4 ACT CBT 113-114 with Japanese notes and verified PDF"
            git push origin HEAD:refs/heads/feat/manager-restore-full-p00-p12-p07-4-20261105
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: manager-p07-4-114-slide-research-presentation-pdf
          path: |
            docs/research/manager/masterclass/2026-11-04-p04-causal/journal_club/AI_BEHAVIOR_JOURNAL_CLUB_JA.pptx
            docs/research/manager/masterclass/2026-11-04-p04-causal/journal_club/AI_BEHAVIOR_JOURNAL_CLUB_JA.pdf
          retention-days: 30
