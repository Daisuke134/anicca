name: Temporary Cloud Multi-Travel T-5 Review TDD

on:
  push:
    branches:
      - fix/cloud-multi-travel-t5-20260904

permissions:
  contents: write

jobs:
  focused-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply reviewed production fix
        run: python3 .github/scripts/apply-cloud-multi-travel-t5-concurrent.py
      - name: Run focused reminder tests
        run: |
          node --test \
            apps/life-manager/lib/travel-reminder-multi-due.test.js \
            apps/life-manager/lib/travel-reminder.test.js
      - name: Commit fix and remove temporary TDD machinery
        shell: bash
        run: |
          rm -f .github/scripts/apply-cloud-multi-travel-t5-concurrent.py
          rm -f .github/workflows/temp-cloud-multi-travel-t5-review-tdd.yml
          git config user.name "Life Manager TDD"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(life-manager): bound multi-travel reminder routing"
          git push origin HEAD:${GITHUB_REF_NAME}
