name: Manager BFM-05 DEBUG2 | Minitaur templated-generation probe (throwaway)

on:
  push:
    paths:
      - ".github/workflows/manager-bfm05-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-bfm05-debug2-${{ github.ref }}
  cancel-in-progress: false

env:
  GGUF_SHA256: f8a445c6329e4042dfd20f4722e02c5350ab2072d2df51e861554c07330600b7
  GGUF_SIZE: "4920734208"
  ARCHIVE_SHA256: d9be8922022f26524efe5af7449b50414f0fc781e9b740042e4af7e50e511525

jobs:
  probe:
    name: Probe Minitaur with official template rendered exactly
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build frozen case-1 raw prompt and jinja-rendered templated prompt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe" artifacts/mame-input
          python -m pip install --quiet jinja2
          python - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, "products/manager/evals")
          from qwen3_mame_text_eval import build_cases, download_pinned_text_data
          from gguf_mame_text_eval import rewrap_prompt
          download_pinned_text_data(pathlib.Path("artifacts/mame-input"))
          tmp = os.environ["RUNNER_TEMP"] + "/probe"
          cases = build_cases(pathlib.Path("artifacts/mame-input"), n_cases=24)
          body = rewrap_prompt(cases[0]["_prompt"], "raw")
          open(tmp + "/prompt-raw.txt", "w").write(body)
          import jinja2
          tpl_src = pathlib.Path(
              "products/manager/evals/chat_templates/llama3-instruct.jinja"
          ).read_text(encoding="utf-8")
          env = jinja2.Environment(trim_blocks=True, lstrip_blocks=True,
                                   keep_trailing_newline=True)
          tpl = env.from_string(tpl_src)
          rendered = tpl.render(
              messages=[{"role": "user", "content": body}],
              bos_token="<|begin_of_text|>", eos_token="<|eot_id|>",
              add_generation_prompt=True)
          open(tmp + "/prompt-rendered.txt", "w").write(rendered)
          print("=== RENDERED PROMPT (repr, first 200) ===")
          print(repr(rendered[:200]))
          print("=== RENDERED PROMPT (repr, last 160) ===")
          print(repr(rendered[-160:]))
          PY

      - name: Obtain llama.cpp b12137 and Minitaur GGUF
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/probe/bin"; mkdir -p "$BIN"
          curl --fail --show-error --location --retry 3 --max-time 300 \
            "https://github.com/ggml-org/llama.cpp/releases/download/b12137/llama-b12137-bin-ubuntu-x64.tar.gz" \
            -o "$BIN/llama.tar.gz"
          echo "$ARCHIVE_SHA256  $BIN/llama.tar.gz" | sha256sum --check
          tar -xzf "$BIN/llama.tar.gz" -C "$BIN"
          echo "=== BINARIES ==="; find "$BIN" -maxdepth 3 -type f -name "llama-*" -printf "%f\n" | sort -u
          python -m pip install --quiet "huggingface_hub>=0.26,<1.0" "hf_xet>=1.1"
          python - <<'PY'
          import os, shutil
          from huggingface_hub import snapshot_download
          path = snapshot_download("HillPhelmuth/Llama-3.1-Minitaur-8B-GGUF",
                                   allow_patterns=["unsloth.Q4_K_M.gguf"])
          src = os.path.realpath(os.path.join(path, "unsloth.Q4_K_M.gguf"))
          dest = os.environ["RUNNER_TEMP"] + "/probe/minitaur.gguf"
          shutil.copyfile(src, dest)
          print("model copied:", os.path.getsize(dest))
          PY
          MODEL="$RUNNER_TEMP/probe/minitaur.gguf"
          echo "$GGUF_SHA256  $MODEL" | sha256sum --check
          test "$(stat -c%s "$MODEL")" = "$GGUF_SIZE"

      - name: Variants with full stdout
        shell: bash
        run: |
          set -uo pipefail
          BIN="$RUNNER_TEMP/probe/bin"
          CLI="$(find "$BIN" -type f -name llama-cli | head -n1)"
          COMPLETION="$(find "$BIN" -type f -name llama-completion | head -n1 || true)"
          export LD_LIBRARY_PATH="$(dirname "$CLI"):$BIN/lib"
          MODEL="$RUNNER_TEMP/probe/minitaur.gguf"
          P="$RUNNER_TEMP/probe"
          echo "================ T1: llama-cli raw + --chat-template-file, -n 64, verbose ================"
          timeout 300 "$CLI" -m "$MODEL" -p "$(cat $P/prompt-raw.txt)" \
            --chat-template-file products/manager/evals/chat_templates/llama3-instruct.jinja \
            -n 64 --temp 0 -t 4 -c 2048 --simple-io --single-turn --no-show-timings --verbose 2>&1 | tail -45
          echo "---------------- END T1 ----------------"
          if [ -n "${COMPLETION:-}" ]; then
            echo "================ T2: llama-completion with jinja-rendered prompt, -n 64 ================"
            timeout 300 "$COMPLETION" -m "$MODEL" -p "$(cat $P/prompt-rendered.txt)" \
              -n 64 --temp 0 -t 4 -c 2048 --no-display-prompt --no-show-timings 2>&1 | tail -25
            echo "---------------- END T2 ----------------"
          else
            echo "llama-completion NOT in tarball; T2 skipped"
          fi
          echo "================ T3: llama-cli rendered prompt as -p (completion-style), -n 64 ================"
          timeout 300 "$CLI" -m "$MODEL" -p "$(cat $P/prompt-rendered.txt)" \
            -n 64 --temp 0 -t 4 -c 2048 --simple-io --single-turn --no-display-prompt --no-show-timings 2>&1 | tail -25
          echo "---------------- END T3 ----------------"
