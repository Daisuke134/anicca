name: Manager BFM-05 DEBUG3 | Minitaur no-system completion probe (throwaway)

on:
  push:
    paths:
      - ".github/workflows/manager-bfm05-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-bfm05-debug3-${{ github.ref }}
  cancel-in-progress: false

env:
  GGUF_SHA256: f8a445c6329e4042dfd20f4722e02c5350ab2072d2df51e861554c07330600b7
  GGUF_SIZE: "4920734208"
  ARCHIVE_SHA256: d9be8922022f26524efe5af7449b50414f0fc781e9b740042e4af7e50e511525

jobs:
  probe:
    name: Probe Minitaur completion mode without system block
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build frozen case-1 no-system Llama-3 prompt string
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe" artifacts/mame-input
          python - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, "products/manager/evals")
          from qwen3_mame_text_eval import build_cases, download_pinned_text_data
          from gguf_mame_text_eval import rewrap_prompt
          download_pinned_text_data(pathlib.Path("artifacts/mame-input"))
          tmp = os.environ["RUNNER_TEMP"] + "/probe"
          cases = build_cases(pathlib.Path("artifacts/mame-input"), n_cases=24)
          nosystem = rewrap_prompt(cases[0]["_prompt"], "llama3")
          open(tmp + "/prompt-nosystem.txt", "w").write(nosystem)
          print("no-system prompt head:", repr(nosystem[:90]))
          print("no-system prompt tail:", repr(nosystem[-80:]))
          PY

      - name: Obtain llama.cpp b12137 and Minitaur GGUF
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/probe/bin"; mkdir -p "$BIN"
          curl --fail --show-error --location --retry 3 --max-time 300 \
            "https://github.com/ggml-org/llama.cpp/releases/download/b12137/llama-b12137-bin-ubuntu-x64.tar.gz" \
            -o "$BIN/llama.tar.gz"
          echo "$ARCHIVE_SHA256  $BIN/llama.tar.gz" | sha256sum --check
          tar -xzf "$BIN/llama.tar.gz" -C "$BIN"
          python -m pip install --quiet "huggingface_hub>=0.26,<1.0" "hf_xet>=1.1"
          python - <<'PY'
          import os, shutil
          from huggingface_hub import snapshot_download
          path = snapshot_download("HillPhelmuth/Llama-3.1-Minitaur-8B-GGUF",
                                   allow_patterns=["unsloth.Q4_K_M.gguf"])
          src = os.path.realpath(os.path.join(path, "unsloth.Q4_K_M.gguf"))
          dest = os.environ["RUNNER_TEMP"] + "/probe/minitaur.gguf"
          shutil.copyfile(src, dest)
          print("model copied:", os.path.getsize(dest))
          PY
          MODEL="$RUNNER_TEMP/probe/minitaur.gguf"
          echo "$GGUF_SHA256  $MODEL" | sha256sum --check
          test "$(stat -c%s "$MODEL")" = "$GGUF_SIZE"

      - name: Completion-mode variants (failures isolated)
        shell: bash
        run: |
          set -uo pipefail
          BIN="$RUNNER_TEMP/probe/bin"
          COMPLETION="$(find "$BIN" -type f -name llama-completion | head -n1)"
          echo "completion binary: $COMPLETION"
          export LD_LIBRARY_PATH="$(dirname "$COMPLETION"):$BIN/lib"
          MODEL="$RUNNER_TEMP/probe/minitaur.gguf"
          P="$RUNNER_TEMP/probe"
          echo "================ C2-64: llama-completion, no-system prompt, -n 64 ================"
          timeout 300 "$COMPLETION" -m "$MODEL" -p "$(cat $P/prompt-nosystem.txt)" \
            -n 64 --temp 0 -t 4 -c 2048 --no-display-prompt 2>&1 | tail -20 || echo "C2-64 exit=$?"
          echo "---------------- END C2-64 ----------------"
          echo "================ C2-12: llama-completion, no-system prompt, -n 12 ================"
          timeout 300 "$COMPLETION" -m "$MODEL" -p "$(cat $P/prompt-nosystem.txt)" \
            -n 12 --temp 0 -t 4 -c 2048 --no-display-prompt 2>&1 | tail -20 || echo "C2-12 exit=$?"
          echo "---------------- END C2-12 ----------------"
