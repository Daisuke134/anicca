name: Ampersand Tutor educational first request
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install supported SDK
        run: python -m pip install --disable-pip-version-check --no-input 'openai==3.24.0'
      - name: Call the public tutor endpoint with a fictional beginner question
        env:
          AMPERSAND_API_KEY: ${{ secrets.AMPERSAND_API_KEY }}
        run: |
          python - <<'PY'
          import os,sys
          from openai import OpenAI
          key=os.getenv("AMPERSAND_API_KEY","")
          if not key:
              print("RESULT=MISSING_API_KEY")
              sys.exit(2)
          with OpenAI(base_url="https://ampersand.humansand.ai/v1",api_key=key,max_retries=0,timeout=90) as c:
              ids=[x.id for x in c.models.list().data]
              print("AVAILABLE_TUTOR_MODEL", "ampersand-tutor-v0.1" in ids)
              if "ampersand-tutor-v0.1" not in ids:
                  print("RESULT=TUTOR_UNAVAILABLE")
                  sys.exit(3)
              instructions=("You are tutoring a fictional 18-year-old student named Hana. "
                "Explain unfamiliar words in plain English. Do not claim to have tools or "
                "to interact with a real human.")
              with c.beta.agents.sessions.create(
                agent={"model":"ampersand-tutor-v0.1","instructions":instructions},
                environment={"type":"none"},
                input="What is the difference between a person and a row in an AI dataset? Use a simple example.",
                stream=True,
              ).with_result_collection() as stream:
                  state="STREAM_ENDED"
                  for event in stream:
                      if event.type in {"agent.session.idle","agent.session.failed","agent.session.requires_action"}:
                          state=event.type
                          break
                  result=stream.get_final_result()
              answer=(result.output_text or "").strip()
              print("FINAL_EVENT",state)
              print("ANSWER_LENGTH",len(answer))
              print("SAVED_SESSION",bool(result.session_id))
              print("TUTOR_MODEL_ID","ampersand-tutor-v0.1")
              if state!="agent.session.idle" or not answer:
                  print("RESULT=INCOMPLETE")
                  sys.exit(4)
              print("RESULT=REAL_TUTOR_API_COMPLETED")
          PY
