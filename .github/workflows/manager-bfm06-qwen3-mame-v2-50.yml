# eval v2.0 (2026-11-10): FULL MaMe-Re test pool (all 50 frozen test
# contexts, 33 non-tied) instead of the v1 24-context pilot slice.
# Same seed, same pair selection, same prompts, same scoring code
# (build_cases/score_pairs imported unchanged). v1 protocol and its
# receipts stay frozen; v2 numbers are a separate version, never
# pooled with v1. Research evaluation only.
name: Manager BFM-06 | Qwen3-4B on the full 50-context MaMe-Re test pool (eval v2.0)

on:
  pull_request:
    paths:
      - ".github/workflows/manager-bfm06-qwen3-mame-v2-50.yml"
      - "products/manager/evals/qwen3_mame_text_eval.py"
      - "products/manager/evals/test_qwen3_mame_text_eval.py"
      - "products/manager/evals/heartsteps_assignment_audit.py"
      - "products/manager/evals/test_heartsteps_assignment_audit.py"
      - "products/manager/evals/data/mame_fixed_context_splits_v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-bfm06-mame-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-human-aggregate-text-evaluation:
    name: Actual Qwen3 4B forward passes vs Japanese human aggregate meme ratings
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GGUF_SHA256: "2fde00ce69dd4899c70d020845e2638353015bba0fdf161b3eb965f2bca4464e"
      GGUF_SIZE: "2497280736"
      ARCHIVE_SHA256: "d9be8922022f26524efe5af7449b50414f0fc781e9b740042e4af7e50e511525"
    steps:
      - name: Checkout evaluated commit and frozen benchmark split
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate frozen pair selection, conservative scoring and licenses
        working-directory: products/manager/evals
        run: python -m unittest -v test_qwen3_mame_text_eval.py test_heartsteps_assignment_audit.py

      - name: Download & checksum original CC BY human aggregate ratings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import sys
          sys.path.insert(0, "products/manager/evals")
          from qwen3_mame_text_eval import download_pinned_text_data,verify_sources
          path=pathlib.Path("artifacts/mame-input")
          download_pinned_text_data(path)
          print("Verified source bytes:",verify_sources(path))
          PY

      - name: Freeze all 50 test-pool contexts (eval v2.0) and compare no future labels
        shell: bash
        run: |
          set -euo pipefail
          python products/manager/evals/qwen3_mame_text_eval.py \
            --input-dir artifacts/mame-input --n-cases 50 --dry-run \
            --output artifacts/bfm06-ex-ante-pairs.json

      - name: Obtain pinned llama.cpp release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manager-bfm06/bin"
          curl --fail --show-error --location --retry 3 --retry-delay 5 --max-time 240 \
            "https://github.com/ggml-org/llama.cpp/releases/download/b12137/llama-b12137-bin-ubuntu-x64.tar.gz" \
            -o "$RUNNER_TEMP/manager-bfm06/llama.tar.gz"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/manager-bfm06/llama.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/manager-bfm06/llama.tar.gz" -C "$RUNNER_TEMP/manager-bfm06/bin"
          CLI="$(find "$RUNNER_TEMP/manager-bfm06/bin" -type f -name llama-cli | head -n 1)"
          test -f "$CLI"
          chmod +x "$CLI"
          echo "$CLI" > "$RUNNER_TEMP/manager-bfm06/cli.txt"

      - name: Obtain pinned 4-bit public Qwen3-4B weights
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$RUNNER_TEMP/manager-bfm06/qwen3.gguf"
          curl --fail --show-error --location --retry 3 --retry-delay 5 --max-time 750 \
            "https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/ae44f08e1392f39c0e474af10c3ff8355c8b6688/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf" \
            -o "$MODEL"
          echo "$GGUF_SHA256  $MODEL" | sha256sum --check
          test "$(stat -c%s "$MODEL")" = "$GGUF_SIZE"
          test "$(head -c4 "$MODEL" | od -An -tx1 | tr -d ' \n')" = "47475546"

      - name: Canary prove extracted A/B before scoring 50 cases
        shell: bash
        run: |
          set -euo pipefail
          CLI="$(cat "$RUNNER_TEMP/manager-bfm06/cli.txt")"
          export LD_LIBRARY_PATH="$(dirname "$CLI"):$RUNNER_TEMP/manager-bfm06/bin/lib"
          python - <<'PY_CANARY'
          import pathlib,subprocess,sys,os
          sys.path.insert(0,"products/manager/evals")
          from qwen3_mame_text_eval import build_cases,build_llama_command,parse_llama_reply
          cases=build_cases(pathlib.Path("artifacts/mame-input"),n_cases=50)
          prompt=cases[0]["_prompt"]
          exe=(pathlib.Path(os.environ["RUNNER_TEMP"])/"manager-bfm06"/"cli.txt").read_text().strip()
          weights=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"manager-bfm06"/"qwen3.gguf")
          command=build_llama_command(exe,weights,prompt)
          result=subprocess.run(command,capture_output=True,timeout=100,check=False)
          raw=result.stdout.decode("utf-8",errors="replace")+"\n"+result.stderr.decode("utf-8",errors="replace")
          answer=parse_llama_reply(raw, expected_prompt=prompt)
          import re
          sanitized=raw.replace(prompt,"[PUBLIC_CONTEXT_AND_DESCRIPTION_REDACTED]")
          sanitized=re.sub(r"(?m)^.*(?:状況:|Aのコマの描写:|Bのコマの描写:|回答（A/Bの一文字）:).*$",
                           "[PUBLIC_SOURCE_TEXT_REDACTED]",sanitized)
          print("BFM06_CANARY",{"returncode":result.returncode,"chars":len(raw),
              "prompt_bytes":len(prompt.encode("utf8")),
              "parsed_answer":answer,"sanitized_log_tail":repr(sanitized[-850:])},flush=True)
          assert result.returncode==0 and answer in ("A","B"), "No valid generated A/B; stop BEFORE all 24 eval cases"
          PY_CANARY

      - name: Run real 50-context Qwen 4B forward-pass and compare recorded human votes
        shell: bash
        run: |
          set -euo pipefail
          CLI="$(cat "$RUNNER_TEMP/manager-bfm06/cli.txt")"
          export LD_LIBRARY_PATH="$(dirname "$CLI"):$RUNNER_TEMP/manager-bfm06/bin/lib:${LD_LIBRARY_PATH:-}"
          mkdir -p artifacts
          python products/manager/evals/qwen3_mame_text_eval.py \
            --input-dir artifacts/mame-input --n-cases 50 \
            --llama-cli "$CLI" \
            --model "$RUNNER_TEMP/manager-bfm06/qwen3.gguf" \
            --output artifacts/bfm06-real-qwen-human-meme-eval.json
          python - <<'PY'
          import json
          p="artifacts/bfm06-real-qwen-human-meme-eval.json"
          r=json.load(open(p))
          assert r["model_forward_pass_executed"] is True
          assert r["n_cases"] == 50
          assert r["scores"]["n_model_invalid"] < 50, "no model outputs could be parsed; do not claim evaluated accuracy"
          print("Human-evaluated aggregate pair scores:",r["scores"])
          PY

      - name: Upload reproducible non-personal benchmark receipt (not model weights)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: manager-bfm06-qwen3-mame-v2-50
          path: |
            artifacts/bfm06-ex-ante-pairs.json
            artifacts/bfm06-real-qwen-human-meme-eval.json
          retention-days: 30