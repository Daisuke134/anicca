name: Life Call calendar eval

on:
  pull_request:
    paths:
      - "apps/life-call/**"
      - ".github/workflows/life-call-eval.yml"

jobs:
  calendar-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/life-call
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/life-call/package-lock.json
      - run: npm ci --silent
      - run: npm test
      - run: npm run eval
