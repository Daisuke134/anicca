name: TEMP CLOUD-05 owned verification

on:
  push:
    branches:
      - fix/cloud-05-owned-20260907-a305

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        working-directory: apps/life-manager
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: CLOUD-05 focused and regression contracts
        working-directory: apps/life-manager
        run: |
          node --test \
            lib/cloud-05-settings-recovery.test.js \
            lib/user-command.test.js \
            lib/panel-control-center.test.js \
            lib/panel-api.test.js \
            lib/telegram-onboard.test.js \
            test/tenant-isolation.test.js \
            test/wake-loop-isolation.test.js
      - name: Changed CLOUD-05 test is PII-shape clean
        run: python3 scripts/security/pii_shape_scan.py --allowlist .pii-shape-allowlist apps/life-manager/lib/cloud-05-settings-recovery.test.js
      - name: Diff hygiene
        run: git diff --check a305610cfd0bdf759c48764b494d63893bb94b9f..HEAD
