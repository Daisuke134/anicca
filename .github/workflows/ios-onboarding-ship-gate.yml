name: iOS onboarding ship gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/anicca-ios/**'
      - '.github/workflows/ios-onboarding-ship-gate.yml'
permissions:
  contents: read
concurrency:
  group: ios-onboarding-ship-gate
  cancel-in-progress: false
jobs:
  onboarding-normal-taps:
    # GitHub-hosted macOS runner (owner directive 2026-11-19: no local Mac).
    # workflow_dispatch / push to main only: never pull_request code.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ONBOARDING_SIM_RUNTIME: ${{ vars.ONBOARDING_SIM_RUNTIME }}
      ONBOARDING_SIM_DEVICE_TYPE: ${{ vars.ONBOARDING_SIM_DEVICE_TYPE }}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize private build configuration
        env:
          # Same mapping as the maestro job in anicca-ios-build.yml: the
          # repository secret is ANICCA_E2E_XCCONFIG_B64; ci_post_clone.sh
          # reads it under the production env name.
          ANICCA_PRODUCTION_XCCONFIG_B64: ${{ secrets.ANICCA_E2E_XCCONFIG_B64 }}
        run: bash apps/mobile/anicca-ios/ci_scripts/ci_post_clone.sh
      - name: Select simulator runtime and device type
        run: |
          if [ -z "${ONBOARDING_SIM_RUNTIME:-}" ]; then
            RUNTIME=$(xcrun simctl list runtimes available --json | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['name'].startswith('iOS')]; print(rs[-1]['identifier'])")
            echo "ONBOARDING_SIM_RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          fi
          if [ -z "${ONBOARDING_SIM_DEVICE_TYPE:-}" ]; then
            DEVICE=$(xcrun simctl list devicetypes --json | python3 -c "import json,sys,re; ds=json.load(sys.stdin)['devicetypes']; cands=sorted((int(m.group(1)), d['name'], d['identifier']) for d in ds for m in [re.match(r'iPhone (\d+)', d['name'])] if m); print(cands[-1][2])")
            echo "ONBOARDING_SIM_DEVICE_TYPE=$DEVICE" >> "$GITHUB_ENV"
          fi
          echo "runtime=${ONBOARDING_SIM_RUNTIME:-auto} device=${ONBOARDING_SIM_DEVICE_TYPE:-auto}"
      - name: Full onboarding with single normal taps
        run: bash apps/mobile/anicca-ios/scripts/onboarding-ship-gate.sh
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-normal-taps-${{ github.sha }}
          if-no-files-found: warn
          path: |
            apps/mobile/anicca-ios/build/onboarding-gate/**/source.txt
            apps/mobile/anicca-ios/build/onboarding-gate/**/*.log
            apps/mobile/anicca-ios/build/onboarding-gate/**/*.json
            apps/mobile/anicca-ios/build/onboarding-gate/**/*.xcresult
