name: Manager BFM-01 | train and package real HBCP outcome-head JSON weights

on:
  pull_request:
    paths:
      - ".github/workflows/manager-bfm01-train-open-hbcp-outcome-head.yml"
      - "products/manager/models/manager_hbcp_ridge_head.py"
      - "products/manager/models/test_manager_hbcp_ridge_head.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-hbcp-outcome-head:
    name: Fit CC0 real RCT-arm Ridge and export verified plain JSON
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Only run on our exact reviewed branch, never untrusted forks
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPO" = "Daisuke134/life-manager"
          test "$TARGET_REPO" = "$SOURCE_REPO"
          test "$SOURCE_BRANCH" = "feat/bfm01-qwen4-real-hbcp-cpu-pilot-20261105"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ordinary CPU scientific libraries
        run: python -m pip install --disable-pip-version-check "numpy>=1.24,<3" "pandas>=2,<4" "scikit-learn>=1.3,<1.9"
      - name: Verify JSON inference contract on synthetic SOFTWARE examples
        working-directory: products/manager/models
        run: python -m unittest -v test_manager_hbcp_ridge_head.py
      - name: Replay prior real HBCP 5-fold study-disjoint validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python products/manager/evals/hbcp_smoking_outcome_baselines.py \
            > artifacts/bfm01-hbcp-5fold-aggregate.json
          python - <<'PY'
          import json
          a=json.load(open('artifacts/bfm01-hbcp-5fold-aggregate.json'))
          assert a["n_arms"]==971 and a["n_studies"]==405
          print("HBCP real RCT arms",a["n_arms"],"study groups",a["n_studies"])
          for label in ("train_mean","ridge","random_forest"):
              print(label, a["results"][label]["mae_percentage_points"])
          PY
      - name: Train final model on all published arms and export open JSON weights
        shell: bash
        run: |
          set -euo pipefail
          python products/manager/models/manager_hbcp_ridge_head.py \
            --output products/manager/models/checkpoints/manager-hbcp-ridge-arm-rate-v0.json \
            --receipt artifacts/bfm01-hbcp-json-weights-receipt.json
          test -s products/manager/models/checkpoints/manager-hbcp-ridge-arm-rate-v0.json
          python - <<'PY'
          import json
          p='products/manager/models/checkpoints/manager-hbcp-ridge-arm-rate-v0.json'
          j=json.load(open(p))
          assert j["model_id"]=="manager-hbcp-ridge-arm-rate-v0"
          assert j["intervention_arms"]==971 and j["study_id_count"]==405
          assert j["trained_behavioral_foundation_model"] is False
          assert j["causal_effect_estimated"] is False
          print("True learned baseline weights:",len(j["coefficients"]),
                "no individual raw rows, no clinical claims")
          PY
      - name: Commit only deterministic open model JSON to reviewed PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products/manager/models/checkpoints/manager-hbcp-ridge-arm-rate-v0.json
          if git diff --cached --quiet; then
            echo "Open weights already at identical version"
          else
            git commit -m "model(manager): publish trained CC0 study-arm Ridge weights with verified export"
            git push origin HEAD:refs/heads/feat/bfm01-qwen4-real-hbcp-cpu-pilot-20261105
          fi
      - name: Save aggregate training and validation receipts
        uses: actions/upload-artifact@v4
        with:
          name: manager-bfm01-hbcp-trained-open-json-weights-verified
          path: |
            artifacts/bfm01-hbcp-5fold-aggregate.json
            artifacts/bfm01-hbcp-json-weights-receipt.json
            products/manager/models/checkpoints/manager-hbcp-ridge-arm-rate-v0.json
          retention-days: 30
