name: Temporary Cloud Multi-Travel T-5 Final Verify

on:
  push:
    branches:
      - fix/cloud-multi-travel-t5-20260904

permissions:
  contents: read

jobs:
  focused-final:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify scoped diff
        run: git diff --check origin/main...HEAD
      - name: Run focused Cloud reminder suite
        run: |
          node --test \
            apps/life-manager/lib/travel-reminder-multi-due.test.js \
            apps/life-manager/lib/travel-reminder.test.js
