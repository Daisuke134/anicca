[build]
  base = "apps/landing"
  publish = "out"
  command = "npm ci && npm run build"
  functions = "netlify/functions"

[build.environment]
  GIT_LFS_ENABLED = "false"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/income/apply"
  to = "/.netlify/functions/income-apply"
  status = 200

[[redirects]]
  from = "/api/income/webhook"
  to = "/.netlify/functions/income-webhook"
  status = 200

[[redirects]]
  from = "/api/income/list"
  to = "/.netlify/functions/income-list"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://anicca-proxy-production.up.railway.app/api/:splat"
  status = 200

[[redirects]]
  from = "/billing/manage"
  to = "/"
  status = 301

[[redirects]]
  from = "/support"
  to = "/support/en"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy/en"
  status = 301

[[redirects]]
  from = "/app"
  to = "https://apps.apple.com/app/id6755129214"
  status = 302

[[redirects]]
  from = "/challenge"
  to = "https://apps.apple.com/app/id6755129214"
  status = 302

[[redirects]]
  from = "/revenue"
  to = "/revenue.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/.netlify/functions/account"
  status = 200

[[redirects]]
  from = "/account/*"
  to = "/.netlify/functions/account"
  status = 200

[[redirects]]
  from = "/anicca-mobile"
  to = "/affirmation-app"
  status = 301

[[redirects]]
  from = "/anicca-mobile/*"
  to = "/affirmation-app/:splat"
  status = 301
