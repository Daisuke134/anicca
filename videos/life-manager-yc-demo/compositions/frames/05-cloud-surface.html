    (() => {
      const root = document.querySelector('[data-composition-id="05-cloud-surface"]');
      if (!root || typeof gsap === "undefined") return;

      const byId = (id) => {
        const element = document.getElementById(id);
        return element && root.contains(element) ? element : null;
      };
      const timeline = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["05-cloud-surface"] = timeline;

      timeline.fromTo(
        byId("f05-cloud-surface-kicker"),

        { opacity: 0, scale: 0.965, y: 18 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.05
      );

      const cardEntrances = [
        ["f05-cloud-surface-card-telegram", -74, 1.2],
        ["f05-cloud-surface-card-scheduler", -74, 1.95],
        ["f05-cloud-surface-card-wake", -74, 2.7],

        ["f05-cloud-surface-card-billing", 74, 4.2],
        ["f05-cloud-surface-card-state", 74, 4.95]
      ];

      cardEntrances.forEach(([id, x, start]) => {
        timeline.fromTo(
          byId(id),
          { x, scale: 0.96, opacity: 0 },
          { x: 0, scale: 1, opacity: 1, duration: 0.72, ease: "power3.out" },
          start
        );
      });

      const connectorIds = [
        "f05-cloud-surface-line-telegram",
        "f05-cloud-surface-line-scheduler",
        "f05-cloud-surface-line-wake",
        "f05-cloud-surface-line-auth",
        "f05-cloud-surface-line-billing",
        "f05-cloud-surface-line-state"
      ];

      connectorIds.forEach((id, index) => {
        const path = byId(id);
        const length = path.getTotalLength();
        gsap.set(path, { strokeDasharray: length, strokeDashoffset: length });
        timeline.to(
          path,
          { strokeDashoffset: 0, duration: 0.58, ease: "power2.out" },
          5.8 + index * 0.1
        );
      });

      const tokenEntrances = [
        ["f05-cloud-surface-token-left-one", -80, 5.95],
        ["f05-cloud-surface-token-right-one", 80, 6.05],
        ["f05-cloud-surface-token-left-two", -80, 6.15],

        ["f05-cloud-surface-token-right-three", 80, 6.45]

          { x, opacity: 0, scale: 0.88 },
          { x: 0, opacity: 1, scale: 1, duration: 0.72, ease: "power2.out" },

        { opacity: 0, y: 14, clipPath: "inset(0 100% 0 0)" },
