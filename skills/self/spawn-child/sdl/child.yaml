version: "2.0"
# Image-independent child boot SDL (Akash self-spawn). Uses a PUBLIC base image (node:22-bookworm) and
# overrides the entrypoint with command/args to clone + run our own OSS repo, so booting never depends
# on a custom registry image being reachable. Placeholders ${CHILD_ID}/${PRICE_DENOM}/${PRICE_AMOUNT} are
# substituted by deploy-akash.sh (AKASH_SDL_TEMPLATE=this file) via envsubst before submission on-chain.
services:
  automaton:
    image: node:22-bookworm
    env:
      - AUTOMATON_GOAL=earn
      - ANICCA_CHILD_ID=${CHILD_ID}
    command: ["/bin/sh", "-c"]
    args:
      - |
        apt-get update && apt-get install -y git python3 python3-pip
        git clone --depth 1 https://github.com/Daisuke134/life-manager /opt/anicca
        cd /opt/anicca && ./install.sh && node runtime/loop/index.mjs
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
profiles:
  compute:
    automaton:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 1Gi
  placement:
    akash:
      pricing:
        automaton:
          denom: ${PRICE_DENOM}
          amount: ${PRICE_AMOUNT}
deployment:
  automaton:
    akash:
      profile: automaton
      count: 1
