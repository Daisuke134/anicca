id: TC-A1
category: silent_archive
name: "FIX-TEST promo from self"
spec_ref: "§13.1"
input:
  from: "${OSS_TEST_RECIPIENT}"
  to: "${OSS_TEST_RECIPIENT}"
  subject: "🎁 [TC-A1-{ts}] EXCLUSIVE OFFER - Weekend Sale 50% off promotion"
  body: |
    🎉 BIG SALE THIS WEEKEND! 50% OFF EVERYTHING!

    Don't miss our exclusive offer. Limited time only!
    Click here to shop now. Best deals on summer collection.

    Newsletter unsubscribe: example.com/unsub
expected:
  triage4: "no"
  triage_reason_match: "SKIP_SUBJECT regex|SELF_FROM regex"
  archive: true
  reply: false
verify:
  - type: gmail_label
    thread_query: "subject:\"TC-A1\" newer_than:1h"
    label: "INBOX"
    expect_absent: true
  - type: not_replied
    thread_query: "subject:\"TC-A1\" newer_than:1h"
