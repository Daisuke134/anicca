<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#123a54"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020817" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1380" cy="170" r="310" fill="#19c6a3" opacity=".12"/>
  <circle cx="180" cy="1080" r="350" fill="#4f8cff" opacity=".10"/>

  <text x="120" y="160" fill="#78ead5" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="5">PYTHON API INTEGRATION</text>
  <text x="120" y="260" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700">One endpoint.</text>
  <text x="120" y="345" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700">Working end to end.</text>

  <g filter="url(#shadow)">
    <rect x="120" y="465" width="380" height="310" rx="34" fill="#10243a" stroke="#2b5878" stroke-width="3"/>
    <rect x="610" y="465" width="380" height="310" rx="34" fill="#10243a" stroke="#2b5878" stroke-width="3"/>
    <rect x="1100" y="465" width="380" height="310" rx="34" fill="#10243a" stroke="#2b5878" stroke-width="3"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="310" y="555" fill="#78ead5" font-size="30" font-weight="700">DOCUMENTED API</text>
    <text x="310" y="645" fill="#ffffff" font-size="64" font-weight="700">{ JSON }</text>
    <text x="310" y="710" fill="#a9bdd0" font-size="28">request + response</text>

    <text x="800" y="555" fill="#78ead5" font-size="30" font-weight="700">PYTHON SCRIPT</text>
    <text x="800" y="650" fill="#ffffff" font-size="82" font-weight="700">&lt;/&gt;</text>
    <text x="800" y="710" fill="#a9bdd0" font-size="28">config + error handling</text>

    <text x="1290" y="555" fill="#78ead5" font-size="30" font-weight="700">VERIFIED OUTPUT</text>
    <circle cx="1290" cy="635" r="52" fill="#19c6a3"/>
    <path d="M1260 636l21 22 43-50" fill="none" stroke="#071426" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1290" y="710" fill="#a9bdd0" font-size="28">README + one test</text>
  </g>

  <path d="M515 620h76" stroke="#78ead5" stroke-width="8" stroke-linecap="round"/>
  <path d="M570 598l22 22-22 22" fill="none" stroke="#78ead5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1005 620h76" stroke="#78ead5" stroke-width="8" stroke-linecap="round"/>
  <path d="M1060 598l22 22-22 22" fill="none" stroke="#78ead5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="120" y="900" width="1360" height="150" rx="30" fill="#ffffff" opacity=".07"/>
  <text x="800" y="965" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Clear scope  •  3-day delivery  •  1 revision</text>
  <text x="800" y="1018" fill="#a9bdd0" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="middle">A focused integration for one documented REST API endpoint</text>
</svg>
