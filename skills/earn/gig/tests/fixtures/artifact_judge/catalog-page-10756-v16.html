#sdsCat .sds-ov-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;color:#2b3540;font-weight:700;letter-spacing:.14em;font-size:14px;border-bottom:1px solid var(--line);background:#fff;}

/* ▼ 2026-07-30 追記: PC表示の「見開き(2ページ)」表示と上下の見切れ防止
   StPageFlip は本の表示枠の幅が 630px (= minWidth 315 × 2) 未満になると
   自動的に1ページ表示(portrait)へ切り替わる。記事カラム幅では枠が 508px
   しか取れず1ページ表示になっていたため、このビューアだけを本文幅より広げて
   630px 以上を確保する。併せて幅の上限を利用可能な高さから逆算し、上下の
   見切れを防ぐ (見開きの高さ = 幅 × 0.70729、その逆数 = 1.4138) */
@media (min-width:821px){
  #sdsCat{
    --sds-w: min(1360px, calc(100vw - 40px));
    --sds-h: min(86vh, calc(100vh - 140px));
    width: var(--sds-w) !important;
    max-width: none !important;
    margin-left: calc(50% - var(--sds-w) / 2) !important;
    margin-right: 0 !important;
    height: var(--sds-h) !important;
  }
  #sdsCat .sds-stage{ padding-top: 8px !important; padding-bottom: 8px !important; }
  #sdsCat #sdsBookWrap{
    max-width: calc((var(--sds-h) - 152px) * 1.4138) !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }
}
@media (min-width:821px) and (max-height:820px){
  #sdsCat{ --sds-h: min(92vh, calc(100vh - 96px)); }
}
