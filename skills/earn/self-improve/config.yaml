# config.yaml — openevolve run configuration for the self-improve harness (REQ-OE4/OE5).
#
# Field names follow the real algorithmicsuperintelligence/openevolve `openevolve/config.py`
# (re-verified 2026-07-07 against the actually pip-installed `openevolve==0.3.0` in the proving
# venv — see execution-notes-self-improve.md "Stage-2 real run"): `EvaluatorConfig.cascade_thresholds`
# (default [0.5, 0.75, 0.9]) and `DatabaseConfig.num_islands` (default 5).

max_iterations: 40  # raised from 20 (close-loop revision, 2026-07-08): the prior 10-iteration
                    # real run's tracked "best" never moved off the unmodified seed program — more
                    # attempts is the cheap, non-gaming lever (this run stays $0, free-tier only).
checkpoint_interval: 10  # top-level Config field (NOT database.checkpoint_interval). Raised from
                         # 5 -> 10 for 40 iterations to cut checkpoint-write disk churn on this
                         # box's tight local disk (df showed <900Mi free before this run — see
                         # execution-notes-self-improve.md's close-loop-2 section).

llm:
  # Endpoint = the colony's own local ClawRouter proxy (127.0.0.1:8402), backed by the
  # SELF-FUNDED anicca-a3cdd4 automaton's own wallet (0xa3CDd4Ec... on Base) — NOT a human's
  # personal API key/subscription (REQ-OE4 / no-human-loop invariant). Wallet balance is $0.00
  # (verified via `clawrouter wallet` 2026-07-08 again), so only a FREE-tier model can be used —
  # this is a structural guarantee against any spend, not just a policy.
  #
  # MODEL CHOICE (re-verified LIVE 2026-07-08, close-loop-2 revision): built a standalone harness
  # (`/private/tmp/.../scratchpad/test_model_diff.py`, same system_message + the real diff_user.txt
  # shape openevolve sends) and fired the REAL current program at both candidate free models via
  # direct curl to the local proxy — not a guess, an actual side-by-side sample:
  #  - free/mistral-large-3-675b (the sole model the prior 10-iteration run used): 3/3 real samples
  #    (temperature 0.5, 0.9, 1.15) each produced a SEARCH/REPLACE block whose closing fence was the
  #    literal text `>>>>>>>` with NO trailing ` REPLACE` — openevolve's own parser
  #    (utils/code_utils.py::extract_diffs, regex `r"<<<<<<< SEARCH\n(.*?)=======\n(.*?)>>>>>>> REPLACE"`)
  #    requires that exact literal, so every one of these 3 samples silently fails to parse as ANY
  #    diff at all ("No valid diffs found in response") — a chronic per-model formatting habit on
  #    this task, reproduced at 3 different temperatures, not a truncation artifact (all 3 completed
  #    with finish_reason=stop well under the 8192-token cap tested) and not solely the rate-limit
  #    problem this file previously blamed alone.
  #  - free/qwen3.5-122b-a10b: 1/1 live sample (temperature 0.7, before its own free-tier bucket
  #    also 429'd on a second call) produced a byte-correct `<<<<<<< SEARCH` / `=======` /
  #    `>>>>>>> REPLACE` block, reproducing the ENTIRE score_candidate function body (including the
  #    EVOLVE-BLOCK-START/END marker lines, unmodified, at the same relative position) — verified by
  #    hand against `lib/gate_math.py::diff_in_scope` that this specific shape (whole-block replace,
  #    markers preserved verbatim) computes identical fixed-region prefix/suffix to baseline and
  #    therefore PASSES scope_guard, not just "looks like a diff".
  # Conclusion: qwen3.5-122b-a10b is the model with demonstrated correct diff-format compliance on
  # THIS task; mistral-large-3-675b is kept as a second ensemble entry purely for request-volume
  # redundancy across a SEPARATE free-tier rate-limit bucket (confirmed independently 200/429 from
  # each other live) — its low format-compliance means most of its samples are wasted iterations,
  # never a harmful one (a failed parse just leaves the tracked best unchanged), so keeping it costs
  # nothing but adds a second bucket to draw from when qwen's own bucket is exhausted.
  api_base: "http://127.0.0.1:8402/v1"
  api_key: "unused-local-proxy-no-auth"  # the local ClawRouter proxy does not check this value
  # openevolve's OpenAI client ALWAYS includes `top_p` in the request body (even when None), and
  # the local ClawRouter proxy's schema validator 400s on `"top_p": null` ("expected number,
  # received null") — confirmed live 2026-07-07 in the first trial run (every LLM call failed
  # before this fix). Must be a real number.
  top_p: 1.0
  # max_tokens raised from openevolve's own default (4096) to 8192 (close-loop-2, 2026-07-08):
  # live test responses (explanatory prose + diff) ran 11.8k-16.1k chars — comfortably under 8192
  # tokens but close enough to the 4096-token default that a verbose sample could plausibly be cut
  # off mid-diff on some future longer response. This is pure headroom, not a fitness/gate change.
  max_tokens: 8192
  # The free-tier bucket for each model is a SHORT rolling-window rate limit, not a hard daily cap
  # — confirmed live both 2026-07-07 (mistral) and 2026-07-08 (qwen, 429'd after 2 calls within a
  # couple minutes). Raised retries/retry_delay again (5/20s -> 8/25s) to let a single generation
  # call ride out a short window instead of failing the whole iteration outright.
  retries: 8
  retry_delay: 25
  # Ensemble of TWO different free models (was: one model x 3 temperatures) via openevolve's own
  # LLMEnsemble (llm/ensemble.py::_sample_model — a weighted random.choice over `llm.models` on
  # every generate_with_context call; not a custom addition). Weight biased 2:2:1 toward
  # qwen3.5-122b-a10b (demonstrated correct SEARCH/REPLACE format above) while still drawing from
  # mistral-large-3-675b's separate rate-limit bucket for extra request volume when qwen's own
  # bucket is exhausted. Different temperatures per qwen entry keep the same cache-defeat property
  # documented in this file's prior revision (fixed single-temperature requests are byte-identical
  # at generation 0 and get served from the local proxy's own response cache instead of a fresh
  # sample).
  models:
    - name: "free/qwen3.5-122b-a10b"
      temperature: 0.5
      weight: 2.0
    - name: "free/qwen3.5-122b-a10b"
      temperature: 0.9
      weight: 2.0
    - name: "free/mistral-large-3-675b"
      temperature: 0.7
      weight: 1.0

prompt:
  # Real openevolve (verified against the installed 0.3.0 package: prompts/defaults/diff_user.txt
  # + prompt/sampler.py) NEVER mentions "EVOLVE-BLOCK" anywhere in its own default templates — the
  # markers are shown to the model only as plain text inside the full current-program dump, with
  # no instruction to respect them. This is exactly why scope_guard.py exists as the sole
  # enforcement (see its own module docstring). Left at openevolve's un-augmented default, a real
  # run (2026-07-07, two separate free models, 25 iterations each) produced real LLM-generated
  # SEARCH/REPLACE edits that ALWAYS also touched load_fixture/_stake_for_row outside the block —
  # 100% scope_guard rejection rate. Per the colony's own agent-building rule ("put guidance in the
  # PROMPT, natural language to the model — never a hardcoded gate that overrides the model"), the
  # fix is to STEER the model via its own system message, not to touch scope_guard (which stays the
  # enforcement layer regardless of what the model does).
  system_message: |
    You are an expert software developer tasked with iteratively improving a codebase.
    Your goal is to maximize the FITNESS SCORE while exploring diverse solutions across feature dimensions.
    The system maintains a collection of diverse programs - both high fitness AND diversity are valuable.

    HARD CONSTRAINT: the program you are editing has exactly one region you may change, marked by
    the literal comment lines `# EVOLVE-BLOCK-START` and `# EVOLVE-BLOCK-END`. Every SEARCH block in
    your SEARCH/REPLACE diff MUST be text that appears STRICTLY BETWEEN those two marker lines
    (never the marker lines themselves, never any line before EVOLVE-BLOCK-START, never any line
    after EVOLVE-BLOCK-END). Do not "clean up", refactor, or touch the fixture loader, the backtest
    harness, or any other function outside the marked block, even if it looks improvable — any edit
    outside the block is automatically and unconditionally rejected before it is ever scored, so
    such an edit wastes the whole attempt. Confine 100% of your proposed changes to the body of the
    single function between the markers.

    Your SEARCH/REPLACE diff MUST end its final line with the exact literal text `>>>>>>> REPLACE`
    (all seven `>` characters immediately followed by a single space and the word REPLACE) — a
    closing fence of `>>>>>>>` alone, without the trailing ` REPLACE`, or any other variation, is not
    recognized as a diff at all and your entire response is silently discarded before it is ever
    scored, wasting the whole attempt. Double-check this exact closing line before finishing.

    The highest-leverage lever inside the evolvable function is the trade-SELECTION logic: the
    thresholds (`min_edge`, `min_confidence`) and any equivalent condition that decides WHICH
    candidates get a nonzero stake at all. The fitness score is a Sharpe-like ratio (mean divided by
    standard deviation) over several out-of-sample windows, so uniformly scaling the stake SIZE
    (e.g. changing `base_stake` alone) on an otherwise-UNCHANGED set of selected trades cannot move
    that ratio — it scales the numerator and denominator identically and is not a productive place
    to spend your edits. Tightening the selection condition so only higher-conviction opportunities
    are taken (dropping marginal/noisy edge cases that hurt the worst-case window) tends to raise
    this kind of risk-adjusted score far more reliably than resizing stakes. Prefer exploring
    selection thresholds, new combining features over the given inputs, or genuinely different
    selection logic over stake-size-only changes.

database:
  # Persist the program database + per-program prompt/response logs to disk (real openevolve
  # `DatabaseConfig.db_path`/`log_prompts` fields — not a custom addition) so every real candidate
  # this run generates (not just the tracked "best") is inspectable as evidence afterward, and so
  # a rate-limit-interrupted run can be resumed with `--checkpoint`.
  db_path: "runs/db"
  population_size: 20
  num_islands: 3  # >= 2, REQ-OE5 — MAP-Elites diversity/anti-premature-convergence (openevolve's
                  # own README/configs rationale), NOT a non-stationarity fix (that is REQ-EV3/
                  # RH5's rotated walk-forward windows, per Sutton & Barto's own §2.4 caveat)

evaluator:
  timeout: 60
  # Local convention (this feature): a single-element cascade — the stage1 quick-window net USD
  # (see evaluator.py::STAGE1_MIN_NET_USD) must clear this bar before stage2's walk-forward run is
  # attempted. openevolve's own generic cascade_thresholds are fractions of a normalized reward;
  # our combined_score is USD-scaled, so this list is a local simplification, not upstream's
  # literal default — documented here rather than silently reusing [0.5, 0.75, 0.9].
  cascade_thresholds: [1.0]
