skill: ci-failure-triage
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    # Happy case: a clear real-break in the logs yields verdict real-break and a
    # routing decision recommending the issue-to-pr lane for a downstream run.
    - name: real_break_clear_logs
      runner: default
      inputs:
        logs: |
          npm run build
          src/payments/charge.ts:42:18 - error TS2322: Type 'string' is not assignable to type 'number'.
          ✕ payments > charges the correct amount
          AssertionError: expected 1000 but got "1000"
          Tests failed: 1 of 84
        commit: a1b2c3d4
        repo_state: clean
        min_confidence: "0.6"
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
          reason_code: process_closed
    # Stop case: truncated logs cannot support a confident verdict, so the run
    # blocks (needs_agent) with no routing and seals a refusal.
    - name: ambiguous_truncated_logs
      runner: default
      inputs:
        logs: |
          Running tests...
          [... truncated]
        commit: a1b2c3d4
        repo_state: unknown
        min_confidence: "0.6"
      expect:
        status: failure
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
          reason_code: process_failed

runners:
  default:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    artifacts:
      named_emits:
        triage_packet: stdout
    inputs:
      logs:
        type: string
        required: true
        description: Raw CI failure output (build/test logs) to classify.
      commit:
        type: string
        required: false
        description: Commit SHA under test, for provenance in the packet.
      repo_state:
        type: string
        required: false
        description: Short repo state hint (clean/dirty/unknown).
      min_confidence:
        type: string
        required: false
        description: escalation_policy.min_confidence; below this the run refuses (needs_agent).
