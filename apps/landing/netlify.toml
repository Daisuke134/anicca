
# Private CFO behind basic auth (Dais only)
# Visit /private with Authorization: Basic <base64 of "dais:<password>">
# Password in Netlify env: PRIVATE_CFO_PASSWORD
[[headers]]
  for = "/private"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# B-travel scheduled trigger — runs every morning at 06:00 JST (21:00 UTC)
# Reads Dais's Google Calendar, inserts [Travel] blocks before events missing one.
# Required env: GOOGLE_REFRESH_TOKEN, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# Optional env: GOOGLE_MAPS_API_KEY (defaults 20min), HOME_ADDRESS, GCAL_ID
[functions."life-travel"]
  schedule = "0 21 * * *"

# B-ask: NO Netlify schedule. The daily question round is driven by the LOCAL
# cron job "anicca-life-ask" (~/.openclaw/cron/jobs.json, 06:00 JST) which runs
# node ~/anicca/skills/life/ask/ask.js --action question. That local sender does
# the `gog gmail send` (gog can't run in a Netlify lambda) and calls this function
# at ?action=question (GCal-read-only) + ?action=mark-asked.
# The ?action=reply path is driven by the AgentMail inbound webhook
# ep_3FBcXGwrcP575GjLm46jCMj2TYr (client_id b-ask-reply-webhook).
# Required env (this function): GOOGLE_REFRESH_TOKEN, GOOGLE_CLIENT_ID,
#                               GOOGLE_CLIENT_SECRET (or GOOGLE_CALENDAR_TOKEN), GCAL_ID.
