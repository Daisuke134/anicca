# Real staging only. A human performs the external Google consent once, then
# the resulting session remains in this app's Keychain for this flow. This
# flow never opens a provider URL and never creates a fixture or fake message.
appId: ai.anicca.life-manager
name: Pre-authorized staging bootstrap, route, and confirmed travel receipt
tags:
  - smokeTest
  - staging
  - preauthorized
  - bootstrap
env:
  STAGING_SESSION_ID: ${STAGING_SESSION_ID}
  ROUTE_MESSAGE_ID: ${ROUTE_MESSAGE_ID}
  TRAVEL_RECEIPT_MESSAGE_ID: ${TRAVEL_RECEIPT_MESSAGE_ID}
---
- launchApp
- tapOn:
    id: "paywall.continueFree"
    optional: true
- extendedWaitUntil:
    visible:
      id: "chat.list"
    timeout: 30000
- assertVisible:
    id: "chat.list"
- extendedWaitUntil:
    visible:
      id: "route.card.${ROUTE_MESSAGE_ID}"
    timeout: 60000
- assertVisible:
    id: "route.card.${ROUTE_MESSAGE_ID}"
- tapOn:
    id: "chat.refresh"
- extendedWaitUntil:
    visible:
      id: "route.card.${ROUTE_MESSAGE_ID}"
    timeout: 30000
- assertVisible:
    id: "route.card.${ROUTE_MESSAGE_ID}"
- extendedWaitUntil:
    visible:
      id: "calendar.travelBlock.confirmed.${TRAVEL_RECEIPT_MESSAGE_ID}"
    timeout: 60000
- assertVisible:
    id: "calendar.travelBlock.confirmed.${TRAVEL_RECEIPT_MESSAGE_ID}"
- takeScreenshot: "bootstrap-chat-route"
- takeScreenshot: "bootstrap-chat-travel-block-confirmed"
