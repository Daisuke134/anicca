# Real staging journey. The operator supplies a one-use callback URL from the
# staging session tool; this flow never embeds a token or creates fake data.
appId: ai.anicca.life-manager
name: English real-staging onboarding to route and free chat
tags:
  - smokeTest
  - staging
  - english
env:
  STAGING_CALLBACK_URL: ${STAGING_CALLBACK_URL}
  PROFILE_NAME: ${PROFILE_NAME}
  PROFILE_HOME: ${PROFILE_HOME}
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "welcome.connectCalendar"
    timeout: 30000
- tapOn:
    id: "welcome.connectCalendar"
- openLink: ${STAGING_CALLBACK_URL}
- extendedWaitUntil:
    visible:
      id: "profile.name"
    timeout: 30000
- tapOn:
    id: "profile.name"
- inputText: ${PROFILE_NAME}
- tapOn:
    id: "profile.home"
- inputText: ${PROFILE_HOME}
- hideKeyboard
- tapOn:
    id: "profile.productLocale"
- tapOn:
    id: "profile.locale.en"
- tapOn:
    id: "profile.continue"
- extendedWaitUntil:
    visible:
      id: "phone.skip"
    timeout: 30000
- tapOn:
    id: "phone.skip"
- extendedWaitUntil:
    visible:
      id: "analysis.phase"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "route.showDetails"
    timeout: 60000
- takeScreenshot: "english-route-card"
- tapOn:
    id: "route.showDetails"
- extendedWaitUntil:
    visible:
      id: "route.detail.close"
    timeout: 10000
- assertVisible:
    id: "route.detail.close"
- takeScreenshot: "english-route-detail"
- tapOn:
    id: "route.detail.close"
- tapOn:
    id: "chat.upgrade"
- extendedWaitUntil:
    visible:
      id: "paywall.continueFree"
    timeout: 10000
- assertNotVisible:
    text: "設定"
- assertNotVisible:
    text: "経路全体を表示"
- tapOn:
    id: "paywall.continueFree"
- extendedWaitUntil:
    visible:
      id: "chat.settings"
    timeout: 10000
- tapOn:
    id: "chat.settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- takeScreenshot: "english-settings"
