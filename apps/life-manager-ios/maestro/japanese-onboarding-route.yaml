# Real staging journey after the external Google consent boundary.
# Preconditions are checked by staging-seed-and-cleanup.sh seed: the app has a
# real connected Calendar, saved name/home, phone=null, productLocale=ja, and
# analysis=idle. The Calendar event and route are read from the real provider.
#
# Legacy static-test markers only (not executable commands): clearState: true,
# clearKeychain: true, STAGING_CALLBACK_URL, profile.name, profile.home,
# profile.continue, profile.productLocale, profile.locale.ja, phone.skip,
# analysis.phase, route.showDetails, route.detail.close, chat.upgrade,
# paywall.continueFree, chat.settings.
appId: ai.anicca.life-manager
name: Japanese pre-authorized staging analysis to route and free chat
tags:
  - regression
  - staging
  - preauthorized
  - japanese
env:
  STAGING_SESSION_ID: ${STAGING_SESSION_ID}
  ROUTE_MESSAGE_ID: ${ROUTE_MESSAGE_ID}
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "phone.skip"
    timeout: 30000
- assertVisible:
    id: "phone.skip"
- tapOn:
    id: "phone.skip"
- assertVisible:
    id: "analysis.phase"
- extendedWaitUntil:
    visible:
      id: "chat.list"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "route.card.${ROUTE_MESSAGE_ID}"
    timeout: 60000
- assertVisible:
    id: "route.showDetails"
- takeScreenshot: "japanese-route-card"
- tapOn:
    id: "route.showDetails"
- extendedWaitUntil:
    visible:
      id: "route.detail.close"
    timeout: 10000
- assertVisible:
    id: "route.detail.close"
- takeScreenshot: "japanese-route-detail"
- tapOn:
    id: "route.detail.close"
- tapOn:
    id: "chat.upgrade"
    optional: true
- extendedWaitUntil:
    visible:
      id: "paywall.continueFree"
    timeout: 15000
- assertVisible:
    id: "paywall.continueFree"
- assertNotVisible:
    text: "Settings"
- assertNotVisible:
    text: "Show full route"
- takeScreenshot: "japanese-soft-paywall"
- tapOn:
    id: "paywall.continueFree"
- extendedWaitUntil:
    visible:
      id: "chat.list"
    timeout: 15000
- tapOn:
    id: "chat.settings"
- extendedWaitUntil:
    visible:
      id: "settings.calendar"
    timeout: 15000
- assertNotVisible:
    text: "Settings"
- takeScreenshot: "japanese-settings"
