# Shared value-first journey. Permission is optional; ends at the actual plan CTA.
appId: ai.anicca.app.ios
---
- tapOn:
    text: "Cancel|キャンセル|Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "onboarding-goal-continue"
    timeout: 60000
- tapOn:
    id: "onboarding-goal-self_love"
- tapOn:
    id: "onboarding-goal-continue"
- assertVisible:
    id: "onboarding-first-affirmation"
- tapOn:
    id: "onboarding-first-save"
- tapOn:
    id: "onboarding-first-continue"
- assertVisible:
    id: "onboarding-reminder-continue"
- tapOn:
    id: "onboarding-reminder-continue"
- tapOn:
    id: "onboarding-notifications-skip"
- extendedWaitUntil:
    visible:
      id: "paywall-plan-cta"
    timeout: 60000
- waitForAnimationToEnd
