appId: ai.anicca.app.ios
name: Optional permission recovery stays in the app
---
- clearState
- clearKeychain
- launchApp:
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_US"
- runFlow: ./_onboarding_to_paywall.yaml
- tapOn:
    id: paywall-close-button
- tapOn:
    id: feed-reminders
- tapOn:
    id: reminder-enable-notifications
    retryTapIfNoChange: false
- tapOn:
    text: "^(Allow|許可)$"
    retryTapIfNoChange: false
- assertNotVisible: "^(Allow|許可)$"
- waitForAnimationToEnd
- assertVisible: "Notifications allowed"
- assertVisible:
    id: reminder-enable-notifications
    enabled: true
- tapOn:
    text: Close
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: feed-themes
    timeout: 15000
- takeScreenshot: permission-recovery-returned-to-feed
