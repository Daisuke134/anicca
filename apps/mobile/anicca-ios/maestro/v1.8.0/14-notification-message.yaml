# Inject a notification and activate its actual OS card before this flow.
# iOS 26.5 / Maestro 2.8.0: synthetic Notification Center taps do not activate
# the app in this environment; native Simulator AX activation does. No launchApp
# or deep-link substitution: the OS notification itself must open the app.
# Caller must pass -e MESSAGE=<the exact alert body>.
appId: ai.anicca.app.ios
name: Notification destination preserves and saves the actual alert body
---
- extendedWaitUntil:
    visible:
      id: "quote-text"
    timeout: 20000
- assertVisible: ${MESSAGE}
- takeScreenshot: "notification-exact-message"
- tapOn:
    id: "quote-like"
- tapOn:
    id: "feed-saved"
- scrollUntilVisible:
    element:
      text: ${MESSAGE}
    direction: DOWN
    timeout: 15000

- takeScreenshot: "notification-message-saved"
- tapOn: "Close"
- assertVisible:
    id: "feed-scroll"
- pressKey: HOME
