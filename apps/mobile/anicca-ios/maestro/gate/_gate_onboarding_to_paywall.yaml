# E2E GATE subflow (not a gate flow itself — never run directly).
# Drives the full adaptive onboarding (every question) from a cold launch
# and stops at the system notification-permission dialog, dismissed.
# The calling gate flow then asserts the paywall.
#
# Step sequence is copied 1:1 from the proven
# maestro/onboarding/04-onboarding-v3-full-flow.yaml (1.10.0 adaptive
# onboarding, run against this app in CI), minus its recording steps and
# its paywall tail. Selectors are accessibility ids throughout; every
# wait is an extendedWaitUntil — no fixed sleeps.
appId: ai.anicca.app.ios
---
# Scroll discipline for every option tap below (changed 2026-11-27):
# scrollUntilVisible only ever swipes DOWN, and a swipe that starts
# while the target is already on screen — or while the screen is
# still transitioning in — carries the target off the top, after
# which the command can never find it again. It failed exactly that
# way on the FIRST row of the zodiac list in run 45868572518 and on
# the goal screen's first option in run 45926835034, while passing
# other runs by luck. So: settle first (waitForAnimationToEnd), and
# scroll ONLY when the target is not already visible (runFlow when:
# notVisible). Targets below the fold keep the original scroll.
- launchApp:
    arguments:
      uiTesting: "true"
# A fresh simulator can present the system "Sign in to Apple Account"
# sheet over the app (observed on the CI runner, 2026-11-25: the
# step hierarchy contained only that sheet, no app elements, and the
# welcome CTA never appeared). One optional tap is not enough: in
# gate run 45722754240 (2026-11-26) flow 01 passed this dismissal and
# flow 02 — same subflow, same clearState/clearKeychain — failed it:
# the sheet was up (step screenshots show it, keyboard open) but the
# single tap did not dismiss it, the welcome-CTA wait expired, and
# flows 03-05 cascaded on the unfinished onboarding. Repeat the
# optional tap with a settle wait so a late-appearing sheet and a
# missed first tap both recover; each tap is optional, so the loop
# is a no-op when no sheet is shown.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "Cancel"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome-cta"
    timeout: 30000
- tapOn:
    id: "onboarding-welcome-cta"
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible:
        id: "onboarding-goal-calm"
    commands:
      - scrollUntilVisible:
          element:
            id: "onboarding-goal-calm"
          direction: DOWN
          timeout: 30000
- tapOn:
    id: "onboarding-goal-calm"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "onboarding-goal-continue"
    timeout: 30000
- tapOn:
    id: "onboarding-goal-continue"
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible:
        id: "onboarding-focus_categories-anxiety"
    commands:
      - scrollUntilVisible:
          element:
            id: "onboarding-focus_categories-anxiety"
