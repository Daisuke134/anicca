# E2E GATE 03 (part B) — snapshot T1 after the runner's 35s
# foreground wait. The runner compares the quote-text element between
# the T0 and T1 hierarchy dumps; if the words did not change on their
# own, the gate run fails even though both flows pass individually.
# (Maestro has no text-extraction assertion, so the change proof lives
# in the runner — deterministic, and recorded in gate-result.json as
# the "living-home-words-changed" check.)
appId: ai.anicca.app.ios
name: Gate 03b living home words after wait (T1)
tags: [e2e-gate]
---
- launchApp:
    arguments:
      uiTesting: "true"
      # The living home's auto-advance is DISABLED under -uiTesting by
      # design (HomeAutoAdvance.isDisabledForUITesting in FeedRootView:
      # Maestro steps can outlast the 29s dwell and move the deck
      # mid-assertion) — UNLESS recording mode is requested, in which
      # case the app behaves exactly as it does for a real user. The
      # gate's words-changed proof (runner: T0 dump, 35s foreground
      # wait, T1 dump) is meaningless with the deck frozen: run
      # 45917553504 produced t0 == t1 ("I can say thank you for being
      # understood.") for exactly this reason. Recording mode is set
      # ONLY in flows 03/03b, whose assertions (feed visible, quote
      # visible) are insensitive to which card is showing.
      aniccaRecordingMode: "true"
# A fresh simulator can present the system "Sign in to Apple Account"
# sheet over the app (observed on the CI runner, 2026-11-25), and the
# app re-triggers the StoreKit check -- and with it the sheet -- more
# than once, so a single dismissal is not enough: in gate run
# 45744355774 flow 05 cancelled the sheet once and it was back over
# the home when feed-today was asserted. Repeat the optional tap with
# a settle wait (the same idiom as _gate_onboarding_to_paywall.yaml);
# every tap is optional, so this is a no-op when no sheet is shown.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "Cancel"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
# Same for a deferred system notification-permission dialog.
- tapOn:
    text: "許可しない|Don't Allow|Don’t Allow"
    optional: true
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "feed-today"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "quote-text"
    timeout: 60000
- assertVisible:
    id: "quote-text"
- takeScreenshot: "gate-03-home-t1"
