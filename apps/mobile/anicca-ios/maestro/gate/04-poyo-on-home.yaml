# E2E GATE 04 — Poyo is resident on the living home.
# PoyoView exposes accessibilityLabel "ぽよ" (the mascot's name);
# Maestro matches it as text on iOS.
# LIMIT (documented, accepted): Poyo's *expression* is chosen on-device
# from the intervention context + time of day (PoyoExpression.select)
# and is rendered as a raster image with no accessibility value, so a
# black-box flow cannot force or read an expression switch. Expression
# mapping is covered by the app's unit tests; this gate asserts the
# mascot is present on the home — the user-visible contract.
appId: ai.anicca.app.ios
name: Gate 04 Poyo present on home
tags: [e2e-gate]
---
- launchApp:
    arguments:
      uiTesting: "true"
# A fresh simulator can present the system "Sign in to Apple Account"
# sheet over the app (observed on the CI runner, 2026-11-25), and the
# app re-triggers the StoreKit check -- and with it the sheet -- more
# than once, so a single dismissal is not enough: in gate run
# 45744355774 flow 05 cancelled the sheet once and it was back over
# the home when feed-today was asserted. Repeat the optional tap with
# a settle wait (the same idiom as _gate_onboarding_to_paywall.yaml);
# every tap is optional, so this is a no-op when no sheet is shown.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "Cancel"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
# Same for a deferred system notification-permission dialog.
- tapOn:
    text: "許可しない|Don't Allow|Don’t Allow"
    optional: true
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "feed-today"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "ぽよ"
    timeout: 20000
- assertVisible:
    text: "ぽよ"
- takeScreenshot: "gate-04-poyo-home"
