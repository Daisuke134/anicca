# E2E GATE 02 — the soft paywall after onboarding shows the Annual
# plan as the only card, with the Best Value badge and the free-trial
# timeline. Weekly and Lifetime stay behind "Other plans" and appear
# after that disclosure is tapped. Monthly is NOT offered, and the
# paywall is dismissible without a purchase.
# (Selection state itself is not exposed through the accessibility
# tree; the badge is the black-box observable for "Annual is the
# highlighted plan". Plan visibility is enforced in the app by
# PaywallPlanDisplay — Monthly is filtered out before rendering.)
appId: ai.anicca.app.ios
name: Gate 02 paywall plans weekly annual lifetime, no monthly
tags: [e2e-gate]
---
- clearState
- clearKeychain
- runFlow: _gate_onboarding_to_paywall.yaml
- extendedWaitUntil:
    visible:
      id: "paywall-plan-cta"
    timeout: 60000
- assertNotVisible:
    id: "paywall-plan-weekly"
- assertVisible:
    id: "paywall-plan-annual"
- assertVisible:
    id: "paywall-plan-badge-best-value"
# No scrollUntilVisible anywhere in this flow: on the gate device
# (largest iPhone) the whole paywall fits one screen, and in run
# 45626471372 a scroll swipe landed as a tap on the Lifetime row —
# it SELECTED Lifetime, which removed the Annual trial timeline
# from the tree and failed the run.
# Run 45823132740 (2026-11-26) failed the same assertion with NO
# scroll and NO plan tap anywhere in the flow (maestro.log shows no
# tap command after the onboarding notifications step): the failure
# screenshot shows Lifetime selected (filled check, lifetime CTA and
# disclosure) while the Annual card already rendered "3 days free",
# i.e. trial eligibility for Annual was .eligible. The trial timeline
# renders only while the SELECTED package's trial presentation is
# .eligible (PaywallVariantBView.trialEndDate), so the selection state
# at assertion time — not eligibility, not a dialog — was the failure.
# Make the selection deterministic: tap the Annual card explicitly,
# then assert the timeline. The timeline wait is 60s because trial
# eligibility is a StoreKit round-trip that resolves asynchronously:
# run 45841118170 caught the paywall (in flow 05's evidence) still in
# the .conditional presentation ("If eligible, 3 days free" disclosure,
# no timeline) with Annual selected, minutes after it appeared.
- tapOn:
    id: "paywall-plan-annual"
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible:
      id: "paywall-trial-timeline"
    timeout: 60000
- assertVisible:
    id: "paywall-trial-timeline"
- tapOn:
    id: "paywall-other-plans"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "paywall-plan-lifetime"
    timeout: 15000
- assertVisible:
    id: "paywall-plan-weekly"
- assertVisible:
    id: "paywall-plan-lifetime"
- assertNotVisible:
    id: "paywall-plan-monthly"
- takeScreenshot: "gate-02-paywall"
# Dismissible: close returns to the living home, no purchase made.
- tapOn:
    id: "paywall-close-button"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "feed-today"
    timeout: 20000
