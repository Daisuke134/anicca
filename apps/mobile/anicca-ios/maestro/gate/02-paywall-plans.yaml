# E2E GATE 02 — the soft paywall after onboarding shows ONE offer:
# the Annual plan with the Best Value badge and its trial timeline.
# Weekly and Lifetime fold behind the always-visible "Other plans" row,
# and Monthly is not sold on the paywall at all.
#
# Issue #731 (single yearly offer + one trust line) supersedes the
# "three cards on one screen" layout that Issue #9356 asked for. The
# row expands in place instead of opening a sheet, so no plan is
# hidden — #9356's actual complaint was a plan behind a sheet.
appId: ai.anicca.app.ios
name: Gate 02 paywall single annual offer, other plans expand in place
tags: [e2e-gate]
---
- clearState
- clearKeychain
- runFlow: _gate_onboarding_to_paywall.yaml
- extendedWaitUntil:
    visible:
      id: paywall-plan-cta
    timeout: 60000
# The single offer: Annual only, highlighted, with the folded plans absent.
- assertVisible:
    id: paywall-plan-annual
- assertVisible:
    id: paywall-plan-badge-best-value
- assertNotVisible:
    id: paywall-plan-weekly
- assertNotVisible:
    id: paywall-plan-lifetime
- assertNotVisible:
    id: paywall-plan-monthly
# No scrollUntilVisible anywhere in this flow: in run 45626471372 a
# scroll swipe hit the Lifetime card and selected it. The trial
# timeline is asserted on the Annual offer as rendered.
- extendedWaitUntil:
    visible:
      id: paywall-trial-timeline
    timeout: 60000
- assertVisible:
    id: paywall-trial-timeline
- takeScreenshot: "gate-02-paywall"
# "Other plans" is always visible and expands in place.
- tapOn:
    id: paywall-other-plans
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: paywall-plan-weekly
    timeout: 15000
- assertVisible:
    id: paywall-plan-lifetime
- assertNotVisible:
    id: paywall-plan-monthly
- takeScreenshot: "gate-02-paywall-other-plans"
# Dismissible (soft paywall).
- tapOn:
    id: paywall-close-button
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: feed-today
    timeout: 20000
