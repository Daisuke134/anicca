# E2E GATE 05 — settings round-trip smoke: open Settings from the
# home, switch the theme (sandWave was chosen in onboarding; pick
# sageMist here), see the selection land, close, and land back on
# a living home that still shows words. Catches dead navigation and
# broken sheets — the class of bug that ships silently without E2E.
# Theme choice matters: only sandWave and sageMist are free
# (ThemeID.isFree in ThemeStore.swift); every other theme is premium,
# and tapping a premium theme as a non-subscriber opens the paywall
# instead of selecting it (ThemePickerView) — the app working as
# designed. Run 45841118170 failed exactly there with oceanSunset:
# its failure screenshot is the paywall, not Settings. sageMist is
# the other free theme, so this round-trip switches sandWave -> sageMist.
appId: ai.anicca.app.ios
name: Gate 05 settings round-trip
tags: [e2e-gate]
---
- launchApp:
    arguments:
      uiTesting: "true"
# A fresh simulator can present the system "Sign in to Apple Account"
# sheet over the app (observed on the CI runner, 2026-11-25), and the
# app re-triggers the StoreKit check -- and with it the sheet -- more
# than once, so a single dismissal is not enough: in gate run
# 45744355774 flow 05 cancelled the sheet once and it was back over
# the home when feed-today was asserted. Repeat the optional tap with
# a settle wait (the same idiom as _gate_onboarding_to_paywall.yaml);
# every tap is optional, so this is a no-op when no sheet is shown.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "Cancel"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
# Same for a deferred system notification-permission dialog.
- tapOn:
    text: "許可しない|Don't Allow|Don’t Allow"
    optional: true
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "feed-today"
    timeout: 30000
- tapOn:
    id: "feed-settings"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "settings-theme"
    timeout: 15000
- tapOn:
    id: "settings-theme"
    retryTapIfNoChange: false
- scrollUntilVisible:
    element:
      id: "theme-sageMist"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "theme-sageMist"
    retryTapIfNoChange: false
# Selecting an available theme applies it AND dismisses the picker
# back to the Settings sheet in the same action (ThemePickerView:
# themeStore.select + dismiss), so the in-picker selected checkmark
# (theme-selected-*) no longer exists when any later command runs.
# Run 45917553504 failed on exactly that: its failure screenshot
# shows the Settings sheet already reading "Theme: Sage Mist" — the
# selection HAD landed. The durable observable on the sheet is the
# Theme row's value text.
- extendedWaitUntil:
    visible:
      text: "Sage Mist"
    timeout: 15000
- assertVisible:
    text: "Sage Mist"
- tapOn:
    id: "settings-done"
    retryTapIfNoChange: false
# The StoreKit sandbox sheet can re-appear over the home at any
# entitlement re-check (in run 45744355774 it returned after an
# earlier successful dismissal and failed the feed-today assertion).
# Dismiss it again immediately before asserting the home is visible.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "Cancel"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- extendedWaitUntil:
    visible:
      id: "feed-today"
    timeout: 20000
- assertVisible:
    id: "quote-text"
- takeScreenshot: "gate-05-settings-round-trip"
