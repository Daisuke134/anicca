# x-repost — the first loop declared rather than hand-wired.
#
# Everything launchd needs is here; the absolute paths are produced at install time by
# bin/plistgen.py, which is what makes this file portable to another Mac.

name      = "x-repost"
state_dir = "~/loops/x-repost"

[env]
X_REPOST_BROWSER_IDENTITY = "x:anicca"
X_REPOST_MODEL = "gpt-5.6-luna"
X_REPOST_REASONING_EFFORT = "max"
X_REPOST_PUBLISH_TRANSPORT = "postiz"
X_REPOST_POSTIZ_INTEGRATION_ID = "cmt4l2jld031tqp0y8qtyo983"
X_REPOST_FORCE_KIND = "quote"

# One pass per half-hour. The pass refuses duplicate effects in the same slot; the quality gate
# may still produce no output, so the schedule is a floor on attempts, not a promise of posts.
[jobs.pass]
program          = "skills/x-repost/x-repost-cli.sh"
calendars         = [{ minute = 0 }, { minute = 30 }]

# The schedule and the session are what can die silently here, so this checks both.
[jobs.healthcheck]
program          = "skills/x-repost/x-repost-healthcheck.sh"
interval_seconds = 300

# Evaluate, refill the seed well, then report the trend once a day.
[jobs.digest]
program  = "skills/x-repost/x-repost-digest.sh"
calendar = { hour = 9, minute = 12 }
