# Agent economy resident loop. Code is selected only through the namespaced immutable release;
# mutable instance state remains under ~/loops/agent-economy.
name      = "agent-economy"
state_dir = "~/loops/agent-economy"
state_env = "ANICCA_HOME"
release_root = "~/loops/life-manager"

[env]
ANICCA_REPO     = "~/loops/life-manager/current"
ANICCA_RELEASE_ROOT = "~/loops/life-manager"
ANICCA_CODE_ROOT = "~/loops/life-manager/current"
ANICCA_HOME     = "~/loops/agent-economy"
CEO_EFFECTIVE_CRON_DIR = "~/loops/agent-economy/state/effective-cron"
ANICCA_INSTANCE = "agent-economy"
ANICCA_SLOT_ALLOWLIST = "earn/taskmarket,x402_sell,report,cook"
ANICCA_ECONOMY_RECONCILE = "1"
ANICCA_ECONOMY_CREATE_EVM_WALLET = "1"
COMPUTE_PROXY_PORT = "8422"
ANICCA_FRONTIER_MODEL = "openai/gpt-5.4-nano"
AGENT_ECONOMY_FUNDING_RECEIPT_IDS = "revenue:v2:9e849219a7c479aa837ab3fedbc3f4f25c2a1e8142ce461888cd0a0b3defeeb3"
AGENT_ECONOMY_COMPUTE_MAX_COST_USDC = "0.002"
AGENT_ECONOMY_COMPUTE_RESERVE_USDC = "0.001"
AGENT_ECONOMY_COMPUTE_SESSION_CAP_USDC = "0.002"

[jobs.daemon]
program    = "skills/agent-economy/launch.sh"
label      = "ai.anicca.agent-economy-loop"
keep_alive = true
run_at_load = true
throttle_seconds = 30
