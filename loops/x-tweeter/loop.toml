name      = "x-tweeter"
state_dir = "~/loops/x-tweeter"

[env]
X_REPOST_BROWSER_IDENTITY = "x:anicca"
X_REPOST_MODEL = "gpt-5.6-luna"
X_REPOST_REASONING_EFFORT = "max"
X_REPOST_PUBLISH_TRANSPORT = "postiz"
X_REPOST_POSTIZ_INTEGRATION_ID = "cmt4l2jld031tqp0y8qtyo983"

[jobs.pass]
label     = "ai.anicca.x-tweeter-pass"
program   = "skills/x-tweeter/x-tweeter-cli.sh"
calendars = [{ minute = 15 }]

[jobs.healthcheck]
label            = "ai.anicca.x-tweeter-healthcheck"
program          = "skills/x-tweeter/x-tweeter-healthcheck.sh"
interval_seconds = 300
