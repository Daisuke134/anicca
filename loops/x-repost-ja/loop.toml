name      = "x-repost-ja"
state_dir = "~/loops/x-repost-ja"
state_env = "X_REPOST_JA_STATE_DIR"

[env]
X_REPOST_MODEL = "gpt-5.6-luna"
X_REPOST_REASONING_EFFORT = "max"

[jobs.pass]
program   = "skills/x-repost/x-repost-ja-cli.sh"
calendars = [{ minute = 5 }, { minute = 35 }]

[jobs.healthcheck]
program          = "skills/x-repost/x-repost-healthcheck.sh"
interval_seconds = 300
env = { X_LOOP_NAME = "x-repost-ja", X_LOOP_LABEL = "ai.anicca.x-repost-ja-pass", X_REPOST_STATE_DIR = "/Users/anicca/loops/x-repost-ja", X_REPOST_MAX_PASS_AGE = "5400", X_LOOP_INITIAL_GRACE_SECONDS = "3600" }
