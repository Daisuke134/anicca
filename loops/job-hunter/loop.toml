# Life Manager scheduler declaration. The canonical application side effects remain
# in apps/job-search-loop; this declaration only supplies cadence and entrypoints.
name      = "job-hunter"
state_dir = "~/.local/state/anicca/job-search"

[jobs.acquisition]
program          = "skills/job-hunter/job-hunter-cli.sh"
interval_seconds = 1800
label            = "ai.anicca.job-search-daily"

[jobs.inbox]
program          = "skills/job-hunter/job-hunter-cli.sh"
interval_seconds = 900
label            = "ai.anicca.job-search-inbox"

[jobs.learning]
program = "skills/job-hunter/job-hunter-cli.sh"
calendar = { weekday = 1, hour = 9, minute = 15 }
label = "ai.anicca.job-search-learning"

[jobs.mercor]
program          = "skills/job-hunter/job-hunter-cli.sh"
interval_seconds = 3600
label            = "ai.anicca.job-search-mercor"
