version: 1
name: job-hunter
owner: skills/job-hunter
executor: apps/job-search-loop

state:
  root: ~/.local/state/anicca/job-search
  evidence: ~/.local/state/anicca/job-search/evidence
  telegram_outbox: ~/.local/state/anicca/job-search/telegram-outbox.sqlite3

loops:
  - id: acquisition
    schedule:
      interval_seconds: 1800
      launchd_label: ai.anicca.job-search-daily
    cli: skills/job-hunter/job-hunter-cli.sh daily
    task_schema: apps/job-search-loop/schemas/pass-result.v1.schema.json
    evidence_root: ~/.local/state/anicca/job-search/evidence
    side_effect_owner: apps/job-search-loop
  - id: inbox
    schedule:
      interval_seconds: 900
      launchd_label: ai.anicca.job-search-inbox
    cli: skills/job-hunter/job-hunter-cli.sh inbox
    task_schema: apps/job-search-loop/schemas/inbox-pass-result.v1.schema.json
    evidence_root: ~/.local/state/anicca/job-search/evidence
    side_effect_owner: apps/job-search-loop
  - id: learning
    schedule:
      calendar:
        weekday: 1
        hour: 9
        minute: 15
      launchd_label: ai.anicca.job-search-learning
    cli: skills/job-hunter/job-hunter-cli.sh learning
    task_schema: apps/job-search-loop/schemas/learning-decision.v1.schema.json
    evidence_root: ~/.local/state/anicca/job-search/evidence
    side_effect_owner: apps/job-search-loop
  - id: mercor
    schedule:
      interval_seconds: 3600
      launchd_label: ai.anicca.job-search-mercor
    cli: skills/job-hunter/job-hunter-cli.sh mercor
    task_schema: apps/job-search-loop/schemas/mercor-pass-result.v1.schema.json
    evidence_root: ~/.local/state/anicca/job-search/evidence
    side_effect_owner: apps/job-search-loop
