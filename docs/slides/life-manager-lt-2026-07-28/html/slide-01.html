<!doctype html><html><head><meta charset="utf-8"><style>

  h2 { font-size: 48px; line-height: 1.14; letter-spacing: -0.8px; font-weight: 700; }
  h3 { font-size: 25px; line-height: 1.25; font-weight: 700; }
  p { font-size: 25px; line-height: 1.4; }

  .muted { color: #A6B3BE; }
  .small { font-size: 24px; line-height: 1.4; }
  .tiny { font-size: 17px; line-height: 1.35; }
  .accent { color: #57D6C7; }
  .amber { color: #FFC857; }
  .coral { color: #FF7A66; }
  .green { color: #73D49C; }
  .purple { color: #C89BFF; }
  .title { position: absolute; left: 72px; top: 58px; width: 1136px; }

  .footer { position: absolute; left: 72px; right: 72px; bottom: 28px; display: flex; justify-content: space-between; align-items: center; }
  .footer p { font-size: 13px; line-height: 1; letter-spacing: 1.2px; color: #A6B3BE; }
  .footer .num { color: #57D6C7; font-weight: 700; }
  .card { background: #111C27; border: 1px solid #2A3A49; border-radius: 18px; padding: 24px; }
  .chip { display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid #2A3A49; padding: 8px 13px; }
  .chip p { font-size: 14px; line-height: 1; font-weight: 700; }
  .status-live { border-color: #73D49C; color: #73D49C; }
  .status-next { border-color: #FFC857; color: #FFC857; }
  .status-vision { border-color: #C89BFF; color: #C89BFF; }
  .numCircle { width: 54px; height: 54px; border-radius: 50%; background: #57D6C7; display:flex; align-items:center; justify-content:center; }
  .numCircle p { color: #081018; font-size: 23px; line-height: 1; font-weight: 700; }
</style></head>
