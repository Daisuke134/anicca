<!doctype html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Arial, sans-serif; background: #081018; color: #F7F4EA; }
  .slide { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #081018; }
  h1,h2,h3,p { margin: 0; padding: 0; }
  h1 { font-size: 68px; line-height: 1.08; letter-spacing: -1.5px; font-weight: 700; }
  h2 { font-size: 48px; line-height: 1.14; letter-spacing: -0.8px; font-weight: 700; }
  h3 { font-size: 25px; line-height: 1.25; font-weight: 700; }
  p { font-size: 25px; line-height: 1.4; }
  .kicker { font-size: 16px; line-height: 1; letter-spacing: 3px; font-weight: 700; color: #57D6C7; }
  .muted { color: #A6B3BE; }
  .small { font-size: 24px; line-height: 1.4; }
  .tiny { font-size: 17px; line-height: 1.35; }
  .accent { color: #57D6C7; }
  .amber { color: #FFC857; }
  .coral { color: #FF7A66; }
  .green { color: #73D49C; }
  .purple { color: #C89BFF; }
  .title { position: absolute; left: 72px; top: 58px; width: 1136px; }
  .title h2 { margin-top: 14px; }
  .rule { position: absolute; left: 72px; right: 72px; top: 148px; height: 2px; background: #2A3A49; }
  .footer { position: absolute; left: 72px; right: 72px; bottom: 28px; display: flex; justify-content: space-between; align-items: center; }
  .footer p { font-size: 13px; line-height: 1; letter-spacing: 1.2px; color: #A6B3BE; }
  .footer .num { color: #57D6C7; font-weight: 700; }
  .card { background: #111C27; border: 1px solid #2A3A49; border-radius: 18px; padding: 24px; }
  .chip { display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid #2A3A49; padding: 8px 13px; }
  .chip p { font-size: 14px; line-height: 1; font-weight: 700; }
  .status-live { border-color: #73D49C; color: #73D49C; }
  .status-next { border-color: #FFC857; color: #FFC857; }
  .status-vision { border-color: #C89BFF; color: #C89BFF; }
  .numCircle { width: 54px; height: 54px; border-radius: 50%; background: #57D6C7; display:flex; align-items:center; justify-content:center; }
  .numCircle p { color: #081018; font-size: 23px; line-height: 1; font-weight: 700; }
</style></head>
  <body><section class="slide">
      <div class="title"><p class="kicker">自動修復</p><h2>失敗を見つけて、直し、<span class="purple">次を防ぐ</span></h2></div>
      <div class="rule"></div>
      <div style="position:absolute;left:86px;top:222px;width:1108px;height:300px;display:flex;align-items:center;justify-content:space-between;">
        
          <div style="display:flex;align-items:center;">
            <div class="card" style="width:178px;height:178px;text-align:center;border-color:#57D6C7;">
              <p class="tiny" style="color:#57D6C7;">1</p>
              <h3 style="margin-top:18px;font-size:28px;">観測</h3>
              <p class="tiny muted" style="margin-top:14px;">ログ・数値</p>
            </div>
            <p style="font-size:40px;color:#2A3A49;margin:0 12px;">→</p>
          </div>
          <div style="display:flex;align-items:center;">
            <div class="card" style="width:178px;height:178px;text-align:center;border-color:#C89BFF;">
              <p class="tiny" style="color:#C89BFF;">2</p>
              <h3 style="margin-top:18px;font-size:28px;">判定</h3>
              <p class="tiny muted" style="margin-top:14px;">合格 / 失敗</p>
            </div>
            <p style="font-size:40px;color:#2A3A49;margin:0 12px;">→</p>
          </div>
          <div style="display:flex;align-items:center;">
            <div class="card" style="width:178px;height:178px;text-align:center;border-color:#FFC857;">
              <p class="tiny" style="color:#FFC857;">3</p>
              <h3 style="margin-top:18px;font-size:28px;">修正</h3>
              <p class="tiny muted" style="margin-top:14px;">コード・PR</p>
            </div>
            <p style="font-size:40px;color:#2A3A49;margin:0 12px;">→</p>
          </div>
          <div style="display:flex;align-items:center;">
            <div class="card" style="width:178px;height:178px;text-align:center;border-color:#73D49C;">
              <p class="tiny" style="color:#73D49C;">4</p>
              <h3 style="margin-top:18px;font-size:28px;">確認</h3>
              <p class="tiny muted" style="margin-top:14px;">実物で試す</p>
            </div>
            <p style="font-size:40px;color:#2A3A49;margin:0 12px;">→</p>
          </div>
          <div style="display:flex;align-items:center;">
            <div class="card" style="width:178px;height:178px;text-align:center;border-color:#FF7A66;">
              <p class="tiny" style="color:#FF7A66;">5</p>
              <h3 style="margin-top:18px;font-size:28px;">再発防止</h3>
              <p class="tiny muted" style="margin-top:14px;">テストに残す</p>
            </div>
            
          </div>
      </div>
      <div class="card" style="position:absolute;left:194px;top:534px;width:892px;height:80px;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-color:#FF7A66;">
        <p class="small coral" style="font-weight:700;">失敗したら</p>
        <p class="small">成功扱いしない → 原因を探す → テストを追加 → 修正 → もう一度動かす</p>
      </div>
    <div class="footer"><p>LIFE MANAGER / LT</p><p class="num">09</p></div></section></body></html>
