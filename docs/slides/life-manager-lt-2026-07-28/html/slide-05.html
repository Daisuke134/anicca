<!doctype html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Arial, sans-serif; background: #081018; color: #F7F4EA; }
  .slide { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #081018; }
  h1,h2,h3,p { margin: 0; padding: 0; }
  h1 { font-size: 68px; line-height: 1.08; letter-spacing: -1.5px; font-weight: 700; }
  h2 { font-size: 48px; line-height: 1.14; letter-spacing: -0.8px; font-weight: 700; }
  h3 { font-size: 25px; line-height: 1.25; font-weight: 700; }
  p { font-size: 25px; line-height: 1.4; }
  .kicker { font-size: 16px; line-height: 1; letter-spacing: 3px; font-weight: 700; color: #57D6C7; }
  .muted { color: #A6B3BE; }
  .small { font-size: 24px; line-height: 1.4; }
  .tiny { font-size: 17px; line-height: 1.35; }
  .accent { color: #57D6C7; }
  .amber { color: #FFC857; }
  .coral { color: #FF7A66; }
  .green { color: #73D49C; }
  .purple { color: #C89BFF; }
  .title { position: absolute; left: 72px; top: 58px; width: 1136px; }
  .title h2 { margin-top: 14px; }
  .rule { position: absolute; left: 72px; right: 72px; top: 148px; height: 2px; background: #2A3A49; }
  .footer { position: absolute; left: 72px; right: 72px; bottom: 28px; display: flex; justify-content: space-between; align-items: center; }
  .footer p { font-size: 13px; line-height: 1; letter-spacing: 1.2px; color: #A6B3BE; }
  .footer .num { color: #57D6C7; font-weight: 700; }
  .card { background: #111C27; border: 1px solid #2A3A49; border-radius: 18px; padding: 24px; }
  .chip { display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid #2A3A49; padding: 8px 13px; }
  .chip p { font-size: 14px; line-height: 1; font-weight: 700; }
  .status-live { border-color: #73D49C; color: #73D49C; }
  .status-next { border-color: #FFC857; color: #FFC857; }
  .status-vision { border-color: #C89BFF; color: #C89BFF; }
  .numCircle { width: 54px; height: 54px; border-radius: 50%; background: #57D6C7; display:flex; align-items:center; justify-content:center; }
  .numCircle p { color: #081018; font-size: 23px; line-height: 1; font-weight: 700; }
</style></head>
  <body><section class="slide">
      <div class="title"><p class="kicker">毎日の使い方</p><h2>予定を書いた後は、Life Managerが動く</h2></div>
      <div class="rule"></div>
      <div style="position:absolute;left:88px;top:222px;width:1104px;height:330px;">
        <div style="position:absolute;left:30px;right:30px;top:81px;height:4px;background:#2A3A49;"></div>
        
          <div style="position:absolute;left:0px;top:0;width:224px;text-align:center;">
            <div class="numCircle" style="margin:0 auto;background:#57D6C7;"><p>1</p></div>
            <h3 style="margin-top:26px;">予定を入れる</h3>
            <p class="tiny accent" style="margin-top:9px;font-weight:700;">カレンダー</p>
            <p class="small muted" style="margin-top:10px;">内容を読み取る</p>
          </div>
          <div style="position:absolute;left:220px;top:0;width:224px;text-align:center;">
            <div class="numCircle" style="margin:0 auto;background:#57D6C7;"><p>2</p></div>
            <h3 style="margin-top:26px;">移動を追加</h3>
            <p class="tiny accent" style="margin-top:9px;font-weight:700;">出発時刻</p>
            <p class="small muted" style="margin-top:10px;">出発地から逆算</p>
          </div>
          <div style="position:absolute;left:440px;top:0;width:224px;text-align:center;">
            <div class="numCircle" style="margin:0 auto;background:#57D6C7;"><p>3</p></div>
            <h3 style="margin-top:26px;">電話で起こす</h3>
            <p class="tiny accent" style="margin-top:9px;font-weight:700;">10分前・5分前</p>
            <p class="small muted" style="margin-top:10px;">出るまで知らせる</p>
          </div>
          <div style="position:absolute;left:660px;top:0;width:224px;text-align:center;">
            <div class="numCircle" style="margin:0 auto;background:#FFC857;"><p>4</p></div>
            <h3 style="margin-top:26px;">遅刻を連絡</h3>
            <p class="tiny amber" style="margin-top:9px;font-weight:700;">メール</p>
            <p class="small muted" style="margin-top:10px;">位置を確認して送る</p>
          </div>
          <div style="position:absolute;left:880px;top:0;width:224px;text-align:center;">
            <div class="numCircle" style="margin:0 auto;background:#73D49C;"><p>5</p></div>
            <h3 style="margin-top:26px;">結果を知らせる</h3>
            <p class="tiny green" style="margin-top:9px;font-weight:700;">Telegram</p>
            <p class="small muted" style="margin-top:10px;">終わった内容を報告</p>
          </div>
      </div>
      <div class="card" style="position:absolute;left:260px;top:556px;width:760px;padding:18px;text-align:center;border-color:#57D6C7;">
        <p class="small">普段は <span class="accent">電話とTelegram</span>。Webは、許可、停止、実行結果の確認に使う。</p>
      </div>
    <div class="footer"><p>LIFE MANAGER / LT</p><p class="num">05</p></div></section></body></html>
