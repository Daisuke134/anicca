services:
  worker:
    environment:
      LM_WORKER_CAPABILITIES: ${LM_CONNECTOR_WORKER_CAPABILITIES:-runtime.noop,outbound.event.apply,connector.coverage.refresh}
      LM_WORKER_LEASE_SECONDS: ${LM_CONNECTOR_WORKER_LEASE_SECONDS:-900}
      LM_CONNECTOR_BRIDGE_URL: ${LM_CONNECTOR_BRIDGE_URL:-http://host.docker.internal:18793}
      LM_CONNECTOR_BRIDGE_TOKEN: ${LM_CONNECTOR_BRIDGE_TOKEN:-}
      LM_CONNECTOR_CALENDAR_ID: ${LM_CONNECTOR_CALENDAR_ID:-primary}
      LM_CONNECTOR_PROFILE_PATH: ${LM_CONNECTOR_PROFILE_PATH:-/app/apps/life-manager/config/connector/dais-local.json}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
